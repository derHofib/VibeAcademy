mountDC("\n\n<div style=\"width: 595px; height: 842px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #0F172A; padding: 36px 40px; display: flex; flex-direction: column; gap: 14px; font-size: 9.5px; line-height: 1.45\">\n  <header style=\"display: flex; justify-content: space-between; gap: 16px; border-bottom: 2px solid #0F172A; padding-bottom: 12px\">\n    <div>\n      <div style=\"font-size: 9px; color: #5B6474\">Muster Elektrotechnik GmbH \u00b7 Musterstra\u00dfe 1 \u00b7 10115 Berlin</div>\n      <h1 style=\"margin: 6px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.2\">Nachweis \u00fcber Unterweisung und Kenntnisnahme</h1>\n      <div style=\"margin-top: 4px; color: #334155\">Nachweis-Nr. N-2026-1047-0003 \u00b7 erstellt 05.11.2026 07:16</div>\n    </div>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none\">\n      <div role=\"img\" aria-label=\"Pr\u00fcf-QR-Code\" style=\"display: grid; grid-template-columns: repeat(21, 3px); grid-auto-rows: 3px; padding: 4px; border: 1px solid #E3E6EB\">\n        <template data-k=\"for\" list=\"{{qr}}\" as=\"c\" hint-placeholder-count=\"441\"><div style=\"background: {{c.col}}\"></div></template>\n      </div>\n      <div style=\"font-size: 8px; color: #5B6474\">Echtheit pr\u00fcfen</div>\n    </div>\n  </header>\n\n  <section style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n    <div>\n      <h2 style=\"margin: 0 0 4px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">Schulung</h2>\n      <div><strong>Sicherheitsunterweisung 2026</strong>, Version 3</div>\n      <div>Rechtsgrundlage: DGUV Vorschrift 1 \u00a7 4, ArbSchG \u00a7 12</div>\n      <div>Format: Online mit Wissenscheck \u00b7 14 Seiten</div>\n      <div>Unterweisender: Dennis Hofmann</div>\n      <div style=\"color: #5B6474\">Dokument SHA-256: 9f3c2e\u2026b84d0a71e</div>\n    </div>\n    <div>\n      <h2 style=\"margin: 0 0 4px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">Teilnehmerin</h2>\n      <div><strong>Lea Wagner</strong>, Pers.-Nr. 1047</div>\n      <div>Team Service Nord \u00b7 Elektrofachkraft</div>\n      <div>Eingeladen: 03.11.2026 08:02</div>\n      <div>Bearbeitet: 03.11.\u201305.11.2026 in 3 Sitzungen</div>\n      <div>Lesezeit gesamt: 11:48 min (Mindestzeit 6:22 min)</div>\n    </div>\n  </section>\n\n  <section>\n    <h2 style=\"margin: 0 0 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">Seitenprotokoll</h2>\n    <div style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px\">\n      <template data-k=\"for\" list=\"{{pages}}\" as=\"p\" hint-placeholder-count=\"14\">\n        <div style=\"border: 1px solid #D0D5DD; border-radius: 3px; padding: 4px 5px; font-size: 8.5px; line-height: 1.35\">\n          <div style=\"font-weight: 700\">S. {{p.n}} <span style=\"color: #157347\">\u2713</span></div>\n          <div>{{p.ist}} / {{p.soll}}</div>\n          <div style=\"color: #5B6474\">{{p.seen}}</div>\n        </div>\n      </template>\n    </div>\n    <div style=\"margin-top: 4px; font-size: 8.5px; color: #5B6474\">Ist-Verweildauer / Soll \u00b7 erstmals vollst\u00e4ndig angezeigt (Datum). Gez\u00e4hlt nur bei sichtbarer Seite, aktivem Fenster und Interaktion.</div>\n  </section>\n\n  <section style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n    <div>\n      <h2 style=\"margin: 0 0 4px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">Wissenscheck</h2>\n      <div>Versuch 1: 7 von 10 (70 %) \u2013 nicht bestanden</div>\n      <div>Versuch 2: 9 von 10 (90 %) \u2013 <strong>bestanden</strong></div>\n      <div style=\"color: #5B6474\">Bestehensgrenze 80 %, max. 3 Versuche</div>\n    </div>\n    <div>\n      <h2 style=\"margin: 0 0 4px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">G\u00fcltigkeit</h2>\n      <div>G\u00fcltig bis: <strong>05.11.2027</strong></div>\n      <div>Wiederholung: j\u00e4hrlich, automatische Einladung</div>\n    </div>\n  </section>\n\n  <section style=\"border: 1px solid #0F172A; border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px\">\n    <h2 style=\"margin: 0; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">Best\u00e4tigung</h2>\n    <div style=\"font-size: 10px\">\u201eIch habe die Unterweisung \u201aSicherheitsunterweisung 2026, Version 3\u2018 vollst\u00e4ndig gelesen und verstanden. R\u00fcckfragen konnte ich an Dennis Hofmann richten.\u201c</div>\n    <div style=\"display: flex; gap: 20px; align-items: flex-end\">\n      <div style=\"flex: 1\">\n        <svg width=\"200\" height=\"56\" viewBox=\"0 0 358 100\" role=\"img\" aria-label=\"Unterschrift Lea Wagner\"><path d=\"M40 78c8-30 18-52 24-50s-6 44-4 52 16-30 24-30-4 26 4 26 14-22 20-20-2 18 6 18 12-24 18-20 0 22 8 20c10-2 14-30 22-26s-4 24 6 24 16-14 24-18c10-4 4 16 14 14 12-2 24-18 40-20\" fill=\"none\" stroke=\"#0F172A\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>\n        <div style=\"border-top: 1px solid #0F172A; padding-top: 3px\">Lea Wagner \u00b7 05.11.2026 07:16:09</div>\n      </div>\n      <div style=\"flex: 1; color: #334155\">\n        <div>Authentifizierung: Passwort (Re-Auth)</div>\n        <div>Ger\u00e4t: PC, Chrome \u00b7 IP-Hash a41f\u2026</div>\n        <div>Best.-Text SHA-256: 3d07\u2026e19c</div>\n      </div>\n    </div>\n  </section>\n\n  <footer style=\"margin-top: auto; border-top: 1px solid #D0D5DD; padding-top: 8px; font-size: 8.5px; color: #5B6474; display: flex; flex-direction: column; gap: 2px\">\n    <div>Elektronisch versiegelt (PAdES) mit Zertifikat der Muster Elektrotechnik GmbH \u00b7 qualifizierter Zeitstempel 05.11.2026 07:16:22 MEZ</div>\n    <div>Jede nachtr\u00e4gliche \u00c4nderung macht die Versiegelung ung\u00fcltig. Pr\u00fcfung \u00fcber den QR-Code oben rechts.</div>\n  </footer>\n</div>\n", "\nclass Component extends DCLogic {\n  renderVals() {\n    const N = 21;\n    const fin = (x, y, ox, oy) => {\n      const dx = x - ox, dy = y - oy;\n      if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;\n      const r = Math.max(Math.abs(dx - 3), Math.abs(dy - 3));\n      return r === 3 || r <= 1;\n    };\n    const qr = [];\n    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {\n      let v = fin(x, y, 0, 0); if (v === null) v = fin(x, y, N - 7, 0); if (v === null) v = fin(x, y, 0, N - 7);\n      if (v === null) v = (x < 8 && y < 8) || (x >= N - 8 && y < 8) || (x < 8 && y >= N - 8) ? false : ((x * 5 + y * 11 + x * y) % 3) === 0;\n      qr.push({ col: v ? '#0F172A' : '#FFFFFF' });\n    }\n    const soll = [18, 31, 42, 27, 4, 36, 45, 39, 22, 4, 33, 28, 41, 12];\n    const ist = [34, 52, 71, 40, 9, 63, 88, 61, 30, 6, 58, 47, 66, 20];\n    const day = ['03.11.', '03.11.', '03.11.', '03.11.', '03.11.', '04.11.', '04.11.', '04.11.', '04.11.', '04.11.', '05.11.', '05.11.', '05.11.', '05.11.'];\n    const f = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');\n    const pages = soll.map((s, i) => ({ n: i + 1, ist: f(ist[i]), soll: f(s), seen: day[i] }));\n    return { qr, pages };\n  }\n}\n");
