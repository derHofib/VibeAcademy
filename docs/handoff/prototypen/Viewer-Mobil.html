 </nav>\n\n  <template data-k=\"if\" value=\"{{tocOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; background: rgba(29,36,51,0.28); display: flex; flex-direction: column; justify-content: flex-end\">\n      <section role=\"dialog\" aria-label=\"Inhaltsverzeichnis\" style=\"margin: 0 10px 10px; background: #FFFFFF; border-radius: 30px; max-height: 76%; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(29,36,51,0.12)\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 4px\">\n          <h2 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700\">Inhalt</h2>\n          <button onClick=\"{{closeSheet}}\" style=\"font: inherit; font-size: 14px; font-weight: 600; color: #2E4FB8; background: #EAF0FE; border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer\">Schlie\u00dfen</button>\n        </div>\n        <div style=\"font-size: 12px; color: #5F6B7D; padding: 0 20px 6px\">Erfassung pausiert, solange das Inhaltsverzeichnis offen ist.</div>\n        <div style=\"overflow-y: auto; padding: 0 12px 18px\">\n          <template data-k=\"for\" list=\"{{toc}}\" as=\"r\" hint-placeholder-count=\"18\">\n            <template data-k=\"if\" value=\"{{r.header}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12px; font-weight: 700; color: #5F6B7D; padding: 14px 8px 6px; letter-spacing: 0.03em\">{{r.text}}</div></template>\n            <template data-k=\"if\" value=\"{{r.isPage}}\" hint-placeholder-val=\"{{ true }}\"><button onClick=\"{{r.go}}\" disabled=\"{{r.disabled}}\" style=\"width: 100%; font: inherit; text-align: left; display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 44px; border: none; border-radius: 16px; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; cursor: pointer\"><span style=\"flex: 1\">{{r.text}}</span><span style=\"font-size: 12px; font-weight: 600; color: {{r.sColor}}\">{{r.status}}</span></button></template>\n          </template>\n        </div>\n      </section>\n    </div>\n  </template>\n\n  <template data-k=\"if\" value=\"{{askOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; background: rgba(29,36,51,0.28); display: flex; flex-direction: column; justify-content: flex-end\">\n      <section role=\"dialog\" aria-label=\"Frage stellen\" style=\"margin: 0 10px 10px; background: #FFFFFF; border-radius: 30px; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -10px 30px rgba(29,36,51,0.12)\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\">\n          <h2 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700\">Frage zu {{askRef}}</h2>\n          <button onClick=\"{{closeSheet}}\" style=\"font: inherit; font-size: 14px; font-weight: 600; color: #2E4FB8; background: #EAF0FE; border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer\">Schlie\u00dfen</button>\n        </div>\n        <div style=\"display: flex; gap: 12px; align-items: center\"><span aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 50%; background: #EAF0FE; color: #2E4FB8; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center\">DH</span><div><div style=\"font-size: 14px; font-weight: 600\">Dennis Hofmann</div><div style=\"font-size: 12px; color: #5F6B7D\">Unterweisender \u00b7 antwortet per Mail</div></div></div>\n        <template data-k=\"if\" value=\"{{askForm}}\" hint-placeholder-val=\"{{ true }}\">\n          <textarea rows=\"4\" aria-label=\"Deine Frage\" value=\"{{question}}\" onChange=\"{{onQuestion}}\" placeholder=\"Was ist unklar?\" style=\"font: inherit; font-size: 15px; color: #1D2433; padding: 12px 14px; border: none; border-radius: 18px; background: #F4F6FB; resize: none\"></textarea>\n          <button onClick=\"{{send}}\" disabled=\"{{sendDisabled}}\" style=\"height: 50px; border-radius: 999px; border: none; font: inherit; font-size: 15px; font-weight: 600; background: {{sendBg}}; color: #FFFFFF; cursor: pointer\">Frage senden</button>\n        </template>\n        <template data-k=\"if\" value=\"{{askSent}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #E6F4EC; color: #1E5A3C; border-radius: 18px; padding: 14px 16px; font-size: 14px; line-height: 1.5\">Gesendet. Die Frage wird im Nachweis vermerkt \u2013 du kannst weiterlesen.</div>\n        </template>\n      </section>\n    </div>\n  </template>\n</div>\n", "\nclass Component extends DCLogic {\nCH = ['Grundlagen und Verantwortung', 'Elektrische Gef\u00e4hrdungen', 'Brand- und Explosionsschutz', 'Erste Hilfe und Notfall'];\nPAGES = [\n  { ch: 0, num: '1.1', t: 5, title: 'Warum diese Unterweisung?', intro: 'Einmal im Jahr frischen wir gemeinsam auf, welche Gefahren bei unserer Arbeit bestehen und wie wir uns sch\u00fctzen. Die Unterweisung ist gesetzlich vorgeschrieben.', items: ['Gefahren auf Baustelle und an Ladeinfrastruktur erkennen', 'Im Notfall richtig handeln', 'Rechte und Pflichten kennen'], kind: 'info', callout: 'Lies in Ruhe \u2013 du kannst jederzeit unterbrechen. Dein Fortschritt bleibt gespeichert.' },\n  { ch: 0, num: '1.2', t: 6, title: 'Pflichten auf beiden Seiten', intro: 'Arbeitsschutz funktioniert nur, wenn alle mitmachen.', items: ['Der Betrieb beurteilt Gef\u00e4hrdungen, unterweist und stellt Schutzausr\u00fcstung bereit.', 'Du befolgst Weisungen und benutzt die Schutzausr\u00fcstung bestimmungsgem\u00e4\u00df.', 'Du meldest M\u00e4ngel und gef\u00e4hrliche Situationen sofort deiner F\u00fchrungskraft.'] },\n  { ch: 0, num: '1.3', t: 6, title: 'Pers\u00f6nliche Schutzausr\u00fcstung', intro: 'PSA ist die letzte Schutzebene. Sie wirkt nur, wenn sie passt und intakt ist.', items: ['Sicherheitsschuhe auf jeder Baustelle', 'Schutzhelm bei Gefahr von Kopfverletzungen', 'Bei St\u00f6rlichtbogengefahr Gesichtsschutz und Schutzkleidung', 'Isolierende Handschuhe nach Arbeitsanweisung'], kind: 'warn', callout: 'Besch\u00e4digte PSA nicht benutzen \u2013 sofort austauschen lassen.' },\n  { ch: 1, num: '2.1', t: 5, title: 'Gefahren durch elektrischen Strom', intro: 'Strom ist unsichtbar. Gef\u00e4hrlich wird er durch K\u00f6rperdurchstr\u00f6mung, St\u00f6rlichtb\u00f6gen und Folgeunf\u00e4lle.', items: ['Durchstr\u00f6mung: Verkrampfung, Herzrhythmusst\u00f6rungen, Verbrennungen', 'St\u00f6rlichtbogen: extreme Hitze, Blendung, Druckwelle', 'Folgeunf\u00e4lle: zum Beispiel Sturz von der Leiter'] },\n  { ch: 1, num: '2.2', t: 6, title: 'Wirkung auf den K\u00f6rper', intro: 'Schon wenige zehn Milliampere durch den K\u00f6rper k\u00f6nnen Herzkammerflimmern ausl\u00f6sen. Entscheidend sind Stromst\u00e4rke, Weg durch den K\u00f6rper und Einwirkdauer.', items: [], kind: 'warn', callout: 'Nach jedem Stromunfall \u00e4rztlich untersuchen lassen \u2013 auch wenn du dich gut f\u00fchlst. Rhythmusst\u00f6rungen k\u00f6nnen verz\u00f6gert auftreten.' },\n  { ch: 1, num: '2.3', t: 6, title: 'Schutzma\u00dfnahmen im Alltag', intro: 'Die meisten Unf\u00e4lle passieren an Ger\u00e4ten, die man t\u00e4glich nutzt.', items: ['Ger\u00e4te vor Benutzung auf sichtbare Sch\u00e4den pr\u00fcfen', 'Pr\u00fcfplakette beachten \u2013 abgelaufen hei\u00dft: nicht benutzen', 'Auf Baustellen nur \u00fcber Fehlerstrom-Schutzeinrichtung (RCD) arbeiten', 'Defekte Ger\u00e4te kennzeichnen und aussortieren'] },\n  { ch: 1, num: '2.4', t: 8, title: 'Die f\u00fcnf Sicherheitsregeln', intro: 'Vor jeder Arbeit an elektrischen Anlagen \u2013 immer in dieser Reihenfolge:', numbered: true, items: ['Freischalten', 'Gegen Wiedereinschalten sichern', 'Spannungsfreiheit allpolig feststellen', 'Erden und kurzschlie\u00dfen', 'Benachbarte, unter Spannung stehende Teile abdecken oder abschranken'], kind: 'warn', callout: 'Spannungspr\u00fcfer vor und nach der Messung auf Funktion pr\u00fcfen.' },\n  { ch: 1, num: '2.5', t: 6, title: 'Arbeiten unter Spannung', intro: 'Arbeiten an unter Spannung stehenden Teilen sind grunds\u00e4tzlich verboten.', items: ['Ausnahmen nur mit besonderer Ausbildung, schriftlichem Auftrag und geeigneter Ausr\u00fcstung', 'Im Zweifel: freischalten und die F\u00fchrungskraft fragen'], kind: 'warn', callout: 'Zeitdruck ist nie ein Grund, unter Spannung zu arbeiten.' },\n  { ch: 2, num: '3.1', t: 5, title: 'Br\u00e4nde vermeiden', intro: 'Viele Br\u00e4nde entstehen durch Unachtsamkeit.', items: ['Ordnung halten, Brennbares von Z\u00fcndquellen fernhalten', 'Schwei\u00df-, Schneid- und Trennarbeiten nur mit Erlaubnisschein', 'Kabeltrommeln vollst\u00e4ndig abrollen, Mehrfachsteckdosen nicht \u00fcberlasten'] },\n  { ch: 2, num: '3.2', t: 6, title: 'Feuerl\u00f6scher richtig einsetzen', intro: 'Kenne die Standorte der Feuerl\u00f6scher an deinem Arbeitsplatz und im Fahrzeug.', items: ['Feuer in Windrichtung angreifen', 'Von vorne nach hinten und von unten nach oben l\u00f6schen', 'Mehrere L\u00f6scher gleichzeitig statt nacheinander einsetzen'], kind: 'warn', callout: 'Brennende Lithium-Ionen-Akkus: Abstand halten, Feuerwehr rufen, Bereich absperren.' },\n  { ch: 2, num: '3.3', t: 6, title: 'Verhalten im Brandfall', intro: 'Ruhe bewahren und in dieser Reihenfolge handeln:', numbered: true, items: ['Melden \u2013 Notruf 112', 'Retten \u2013 Personen warnen und in Sicherheit bringen', 'L\u00f6schen \u2013 nur ohne dich selbst zu gef\u00e4hrden', 'Sammelplatz aufsuchen und Vollz\u00e4hligkeit melden'] },\n  { ch: 3, num: '4.1', t: 5, title: 'Notruf absetzen', intro: 'Notruf 112 \u2013 die Leitstelle f\u00fchrt dich durch das Gespr\u00e4ch.', items: ['Wo ist es passiert?', 'Was ist passiert?', 'Wie viele Verletzte?', 'Welche Verletzungen?', 'Warten auf R\u00fcckfragen \u2013 nicht auflegen'] },\n  { ch: 3, num: '4.2', t: 6, title: 'Erste Hilfe beim Stromunfall', intro: 'Bei einem Stromunfall gilt:', numbered: true, items: ['Eigenschutz: Stromkreis unterbrechen, erst dann die Person ber\u00fchren', 'Bewusstsein und Atmung pr\u00fcfen', 'Keine normale Atmung: Notruf, Herzdruckmassage, Defibrillator holen lassen'], kind: 'warn', callout: 'Niemals eine Person ber\u00fchren, die noch mit dem Stromkreis verbunden ist.' },\n  { ch: 3, num: '4.3', t: 5, title: 'Ersthelfer und Verbandbuch', intro: 'Wisse, wer in deinem Team Ersthelfer ist und wo Verbandkasten und Defibrillator h\u00e4ngen.', items: ['Jede Erste-Hilfe-Leistung ins Verbandbuch \u2013 auch kleine Verletzungen', 'Die Ersthelfer-Liste h\u00e4ngt aus und steht in der App'], kind: 'info', callout: 'Geschafft! Als N\u00e4chstes folgt ein kurzer Wissenscheck.' }\n];\nQUIZ = [\n  { text: 'Welche Sicherheitsregel folgt direkt auf \u201eFreischalten\u201c?', opts: ['Erden und kurzschlie\u00dfen', 'Gegen Wiedereinschalten sichern', 'Spannungsfreiheit feststellen'], ok: 1, why: 'Erst sichern, dann pr\u00fcfen: So kann niemand die Anlage versehentlich wieder einschalten.' },\n  { text: 'Was tust du bei einem Stromunfall zuerst?', opts: ['Sofort mit der Herzdruckmassage beginnen', 'Die Person vom Ger\u00e4t wegziehen', 'Den Stromkreis unterbrechen'], ok: 2, why: 'Eigenschutz zuerst \u2013 sonst wirst du selbst durchstr\u00f6mt.' },\n  { text: 'Wie oft muss die Sicherheitsunterweisung mindestens stattfinden?', opts: ['Einmal j\u00e4hrlich', 'Alle zwei Jahre', 'Nur bei der Einstellung'], ok: 0, why: 'DGUV Vorschrift 1 verlangt die Unterweisung mindestens einmal j\u00e4hrlich.' }\n];\n  state = { page: 0, dwell: this.PAGES.map(() => 0), view: 'read', sheet: null, hidden: false, qi: 0, picked: null, score: 0, attempt: 1, question: '', sent: false, zoom: 1 };\n  componentDidMount() { this.timer = setInterval(() => this.tick(), 1000); }\n  componentWillUnmount() { clearInterval(this.timer); }\n  tick() {\n    const { PAGES } = this;\n    const s = this.state;\n    const hidden = typeof document !== 'undefined' && document.visibilityState === 'hidden';\n    if (hidden !== s.hidden) this.setState({ hidden });\n    if (hidden || s.view !== 'read' || s.sheet) return;\n    const p = s.page;\n    if (s.dwell[p] >= PAGES[p].t) return;\n    const dwell = s.dwell.slice();\n    dwell[p] += 1;\n    this.setState({ dwell });\n  }\n  renderVals() {\n    const { CH, PAGES, QUIZ } = this;\n    const s = this.state;\n    const ful = i => s.dwell[i] >= PAGES[i].t;\n    const firstOpen = (() => { const k = PAGES.findIndex((_, i) => !ful(i)); return k === -1 ? PAGES.length : k; })();\n    const p = s.page, cur = PAGES[p];\n    const left = Math.max(0, cur.t - s.dwell[p]);\n    const curDone = ful(p);\n    const doneCount = PAGES.filter((_, i) => ful(i)).length;\n    const isRead = s.view === 'read', isQuiz = s.view === 'quiz', isResult = s.view === 'result';\n    const passed = isResult && s.score === QUIZ.length;\n    const segs = PAGES.map((pg, i) => ({ fill: Math.min(100, Math.round(s.dwell[i] / pg.t * 100)), ring: i === p && isRead ? '0 0 0 2px #C9D6F8' : 'none' }));\n    const go = i => () => this.setState({ page: i, sheet: null, view: 'read' });\n    const overallPct = Math.round(doneCount / PAGES.length * 100);\n\n    const toc = [];\n    CH.forEach((name, c) => {\n      toc.push({ header: true, isPage: false, text: (c + 1) + ' \u00b7 ' + name.toUpperCase() });\n      PAGES.forEach((pg, i) => {\n        if (pg.ch !== c) return;\n        const locked = i > firstOpen;\n        toc.push({ header: false, isPage: true, text: pg.num + '  ' + pg.title, go: go(i), disabled: locked,\n          status: ful(i) ? '\u2713 erfasst' : i === p ? 'aktuell' : locked ? 'gesperrt' : 'offen',\n          sColor: ful(i) ? '#1E7A50' : i === p ? '#2E4FB8' : '#8790A0',\n          bg: i === p && isRead ? '#EAF0FE' : 'transparent', fg: locked ? '#8790A0' : '#1D2433' });\n      });\n    });\n\n    let statusText = '', statusColor = '#3A4456', statusDot = '#3D63DD';\n    if (isRead) {\n      if (s.hidden) { statusText = 'Pausiert \u2013 Fenster nicht aktiv'; statusDot = '#F2B544'; }\n      else if (curDone) { statusText = p === PAGES.length - 1 ? 'Alle Seiten erfasst \u2013 weiter zum Quiz' : 'Seite erfasst \u2013 weiter geht\u2019s'; statusColor = '#1E6A45'; statusDot = '#1E7A50'; }\n      else statusText = 'Seite wird erfasst';\n    } else if (isQuiz) statusText = s.picked === null ? 'W\u00e4hle eine Antwort' : 'Weiter mit dem Pfeil';\n    else { statusText = passed ? 'Bestanden \u2013 jetzt unterschreiben' : 'Noch nicht bestanden'; statusColor = passed ? '#1E6A45' : '#6B4500'; statusDot = passed ? '#1E7A50' : '#F2B544'; }\n\n    let primaryLabel = '', primaryDisabled = false, frac = 0, primary = () => {};\n    let mode = 'arrow';\n    if (isRead) {\n      primaryDisabled = !curDone;\n      frac = curDone ? 1 : s.dwell[p] / cur.t;\n      mode = curDone ? 'arrow' : 'count';\n      primaryLabel = !curDone ? 'Weiter in ' + left + ' Sekunden' : p === PAGES.length - 1 ? 'Zum Wissenscheck' : 'N\u00e4chste Seite';\n      primary = () => { if (!curDone) return; if (p === PAGES.length - 1) this.setState({ view: 'quiz', qi: 0, picked: null, score: 0 }); else this.setState({ page: p + 1 }); };\n    } else if (isQuiz) {\n      primaryDisabled = s.picked === null;\n      frac = (s.qi + (s.picked === null ? 0 : 1)) / QUIZ.length;\n      mode = s.picked === null ? 'wait' : 'arrow';\n      primaryLabel = s.qi === QUIZ.length - 1 ? 'Auswerten' : 'N\u00e4chste Frage';\n      primary = () => { if (s.picked === null) return; if (s.qi === QUIZ.length - 1) this.setState({ view: 'result' }); else this.setState({ qi: s.qi + 1, picked: null }); };\n    } else if (!passed) {\n      mode = 'retry'; frac = 1;\n      primaryLabel = 'Erneut versuchen';\n      primary = () => this.setState({ view: 'quiz', qi: 0, picked: null, score: 0, attempt: s.attempt + 1 });\n    }\n    const active = !primaryDisabled;\n\n    const q = QUIZ[s.qi];\n    const opts = q.opts.map((text, k) => {\n      const answered = s.picked !== null, isOk = k === q.ok, isPicked = k === s.picked;\n      let border = '#E3E8F2', bg = '#FFFFFF', mark = '', markColor = '#1E7A50', opacity = 1;\n      if (answered) {\n        if (isOk) { border = '#9ED3B5'; bg = '#E6F4EC'; mark = '\u2713'; }\n        else if (isPicked) { border = '#F0C08A'; bg = '#FFF4DF'; mark = '\u2715'; markColor = '#8A4B00'; }\n        else opacity = 0.55;\n      }\n      return { text, border, bg, mark, markColor, opacity, locked: answered,\n        pick: () => { if (s.picked !== null) return; this.setState({ picked: k, score: s.score + (k === q.ok ? 1 : 0) }); } };\n    });\n    const right = s.picked !== null && s.picked === q.ok;\n    const z = s.zoom;\n    const px = n => (Math.round(n * z * 10) / 10) + 'px';\n    const zooms = [1, 1.15, 1.3];\n\n    return {\n      headKicker: isRead ? 'Kapitel ' + (cur.ch + 1) + ' von 4' : 'Sicherheitsunterweisung 2026',\n      headTitle: isRead ? CH[cur.ch] : isQuiz ? 'Wissenscheck' : 'Ergebnis',\n      overallPct, overallOffset: (113.1 * (1 - doneCount / PAGES.length)).toFixed(1),\n      segs, cur, pageNo: p + 1, pageLabel: 'Seite ' + (p + 1),\n      isRead, isQuiz, isResult,\n      items: (cur.items || []).map((text, k) => ({ text, mark: cur.numbered ? String(k + 1) : '\u2022' })),\n      hasItems: (cur.items || []).length > 0, hasWarn: cur.kind === 'warn', hasInfo: cur.kind === 'info',\n      h1Size: px(23), bodySize: px(15.5), itemSize: px(15), calloutSize: px(14),\n      zoomLabel: Math.round(z * 100) + ' %',\n      cycleZoom: () => this.setState({ zoom: zooms[(zooms.indexOf(z) + 1) % zooms.length] }),\n      statusText, statusColor, statusDot,\n      back: () => { if (isRead && p > 0) this.setState({ page: p - 1 }); else if (!isRead) this.setState({ view: 'read', page: PAGES.length - 1 }); },\n      backDisabled: isRead && p === 0, backOpacity: isRead && p === 0 ? 0.35 : 1,\n      showPrimaryBtn: !(isResult && passed), showSignLink: isResult && passed,\n      primary, primaryLabel, primaryDisabled, left,\n      ringOffset: (169.6 * (1 - Math.min(1, frac))).toFixed(1),\n      ringTrack: active ? 'rgba(255,255,255,0.35)' : '#E3E8F2',\n      centerBg: active ? '#3D63DD' : '#FFFFFF', centerFg: active ? '#FFFFFF' : '#1D2433', centerShadow: active ? 0.38 : 0.12,\n      cCount: mode === 'count', cArrow: mode === 'arrow', cRetry: mode === 'retry', cWait: mode === 'wait',\n      q, qNo: s.qi + 1, attempt: s.attempt, opts,\n      hasFeedback: s.picked !== null, fbHead: right ? 'Richtig.' : 'Nicht ganz.',\n      fbBg: right ? '#E6F4EC' : '#FFF4DF', fbFg: right ? '#1E5A3C' : '#5A3A00',\n      passed, failed: isResult && !passed, resBg: passed ? '#E6F4EC' : '#FFF4DF',\n      resTitle: passed ? 'Bestanden!' : 'Fast geschafft',\n      resText: passed ? s.score + ' von ' + QUIZ.length + ' Fragen richtig. Tippe auf den gr\u00fcnen Button, um zu unterschreiben.' : s.score + ' von ' + QUIZ.length + ' richtig. Bestanden ist ab 80 %. Schau dir die Erkl\u00e4rungen an und versuch es noch einmal.',\n      tocOpen: s.sheet === 'toc', askOpen: s.sheet === 'ask', toc,\n      tocBtnBg: s.sheet === 'toc' ? '#EAF0FE' : 'transparent', askBtnBg: s.sheet === 'ask' ? '#EAF0FE' : 'transparent',\n      openToc: () => this.setState({ sheet: 'toc' }),\n      openAsk: () => this.setState({ sheet: 'ask', sent: false, question: '' }),\n      closeSheet: () => this.setState({ sheet: null }),\n      askRef: isRead ? 'Seite ' + (p + 1) : 'Frage ' + (s.qi + 1),\n      question: s.question, onQuestion: e => this.setState({ question: e.target.value }),\n      askForm: !s.sent, askSent: s.sent,\n      send: () => { if (s.question.trim()) this.setState({ sent: true }); },\n      sendDisabled: !s.question.trim(), sendBg: s.question.trim() ? '#3D63DD' : '#AFC0EE'\n    };\n  }\n}\n");
</script>
