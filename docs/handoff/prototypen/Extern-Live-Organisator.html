<script>
mountDC("\n\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #1D2433; background: #F4F6FB; min-height: 900px; padding: 24px 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; position: relative\">\n  <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px\">\n    <div style=\"display: flex; align-items: center; gap: 14px\">\n      <a href=\"Extern-pruefen.dc.html\" aria-label=\"Zur\u00fcck zu externen Nachweisen\" style=\"width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,36,51,0.06); display: flex; align-items: center; justify-content: center; color: #1D2433\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M11 3.5L5.5 9l5.5 5.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></a>\n      <div>\n        <div style=\"font-size: 13px; color: #5F6B7D\">Erste-Hilfe-Ausbildung Muster e. V. \u00b7 04.12.2026 \u00b7 08:00\u201315:30 \u00b7 Schulungsraum Lager</div>\n        <h1 style=\"margin: 2px 0 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 700\">Erste-Hilfe-Fortbildung \u00b7 Live</h1>\n      </div>\n    </div>\n    <span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: {{statusBg}}; color: {{statusFg}}; font-size: 14px; font-weight: 600\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: {{statusDot}}\"></span>{{statusText}}</span>\n  </header>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n    <section aria-label=\"QR-Codes\" style=\"flex: 1 1 360px; max-width: 420px; background: #FFFFFF; border-radius: 28px; padding: 22px; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 10px 30px rgba(29,36,51,0.07); display: flex; flex-direction: column; gap: 18px; align-items: center\">\n      <div role=\"tablist\" style=\"display: flex; width: 100%; background: #F4F6FB; border-radius: 999px; padding: 4px; box-sizing: border-box\">\n        <button role=\"tab\" onClick=\"{{tabStart}}\" aria-selected=\"{{startSel}}\" style=\"flex: 1; height: 44px; border-radius: 999px; border: none; font: inherit; font-size: 14px; font-weight: 600; background: {{startBg}}; color: {{startFg}}; box-shadow: {{startSh}}; cursor: pointer\">Start-QR \u00b7 Einchecken</button>\n        <button role=\"tab\" onClick=\"{{tabEnd}}\" aria-selected=\"{{endSel}}\" style=\"flex: 1; height: 44px; border-radius: 999px; border: none; font: inherit; font-size: 14px; font-weight: 600; background: {{endBg}}; color: {{endFg}}; box-shadow: {{endSh}}; cursor: pointer\">Ende-QR \u00b7 Auschecken</button>\n      </div>\n      <template data-k=\"if\" value=\"{{live}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding: 14px; border-radius: 30px; background: {{qrFrame}}\">\n          <div role=\"img\" aria-label=\"{{qrAria}}\" style=\"display: grid; grid-template-columns: repeat(25, 11px); grid-auto-rows: 11px; padding: 16px; background: #FFFFFF; border-radius: 20px\">\n            <template data-k=\"for\" list=\"{{qr}}\" as=\"c\" hint-placeholder-count=\"625\"><div style=\"background: {{c.col}}\"></div></template>\n          </div>\n        </div>\n        <div style=\"text-align: center\"><div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700\">{{qrTitle}}</div><div style=\"font-size: 13px; color: #5F6B7D; margin-top: 4px\">Neuer Code alle 30 s \u00b7 nur heute 07:30\u201316:30 g\u00fcltig</div></div>\n        <div style=\"display: flex; gap: 10px; width: 100%\">\n          <button style=\"flex: 1; height: 46px; border-radius: 999px; border: none; background: #F4F6FB; font: inherit; font-size: 14px; font-weight: 600; color: #1D2433; cursor: pointer\">Vollbild f\u00fcr Beamer</button>\n          <button style=\"flex: 1; height: 46px; border-radius: 999px; border: none; background: #F4F6FB; font: inherit; font-size: 14px; font-weight: 600; color: #1D2433; cursor: pointer\">Aushang drucken</button>\n        </div>\n      </template>\n      <template data-k=\"if\" value=\"{{ended}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width: 100%; height: 360px; border-radius: 24px; background: #F4F6FB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: #5F6B7D\">\n          <svg width=\"44\" height=\"44\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"10\" width=\"14\" height=\"10\" rx=\"2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><path d=\"M8 10V7.5a4 4 0 018 0V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/></svg>\n          <div style=\"font-size: 15px; font-weight: 600; color: #1D2433\">Codes deaktiviert</div>\n          <div style=\"font-size: 13px; max-width: 240px\">Schulung offiziell beendet um 15:30. Ein- und Auschecken ist nicht mehr m\u00f6glich.</div>\n        </div>\n      </template>\n    </section>\n\n    <section aria-label=\"Anwesenheit\" style=\"flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 10px 30px rgba(29,36,51,0.07); display: flex; flex-direction: column; gap: 14px\">\n      <div role=\"tablist\" style=\"display: inline-flex; align-self: flex-start; background: #F4F6FB; border-radius: 999px; padding: 4px\">\n        <template data-k=\"for\" list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button role=\"tab\" onClick=\"{{t.go}}\" aria-selected=\"{{t.sel}}\" style=\"height: 40px; padding: 0 16px; border-radius: 999px; border: none; font: inherit; font-size: 14px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.sh}}; cursor: pointer; display: inline-flex; align-items: center; gap: 8px\">{{t.label}}<span style=\"font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: {{t.badgeBg}}; color: {{t.badgeFg}}\">{{t.badge}}</span></button>\n        </template>\n      </div>\n      <template data-k=\"if\" value=\"{{tabAtt}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n        <template data-k=\"for\" list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"4\"><span style=\"font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: {{k.bg}}; color: {{k.fg}}\">{{k.label}}</span></template>\n      </div>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1.7fr); gap: 8px; padding: 0 12px; font-size: 12px; font-weight: 600; color: #5F6B7D\">\n        <span>Person</span><span>Eingecheckt</span><span>Ausgecheckt</span><span>Dauer</span><span>Status</span>\n      </div>\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <template data-k=\"for\" list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"9\">\n          <div style=\"border-radius: 18px; background: {{r.rowBg}}; padding: 10px 12px\">\n            <div style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1.7fr); gap: 8px; align-items: center; font-size: 14px\">\n              <span style=\"display: flex; align-items: center; gap: 10px; min-width: 0\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 32px; border-radius: 50%; background: #EAF0FE; color: #2E4FB8; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{r.ini}}</span><span style=\"font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{r.name}}</span></span>\n              <span>{{r.inT}} <span style=\"font-size: 12px; color: #5F6B7D\">{{r.inM}}</span></span>\n              <span>{{r.outT}} <span style=\"font-size: 12px; color: #5F6B7D\">{{r.outM}}</span></span>\n              <span style=\"font-variant-numeric: tabular-nums\">{{r.dur}}</span>\n              <span><span style=\"display: inline-block; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: {{r.stBg}}; color: {{r.stFg}}; white-space: nowrap\">{{r.status}}</span></span>\n            </div>\n            <template data-k=\"if\" value=\"{{r.hasNote}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0 2px 42px\">\n                <span style=\"flex: 1 1 260px; font-size: 13.5px; line-height: 1.45; color: #5A3A00\"><strong>{{r.reason}}:</strong> \u201e{{r.note}}\u201c</span>\n                <template data-k=\"if\" value=\"{{r.open}}\" hint-placeholder-val=\"{{ true }}\">\n                  <button onClick=\"{{r.ask}}\" style=\"height: 38px; padding: 0 14px; border-radius: 999px; border: none; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #6B4500; cursor: pointer\">Nachfragen</button>\n                  <button onClick=\"{{r.accept}}\" style=\"height: 38px; padding: 0 14px; border-radius: 999px; border: none; background: #3D63DD; font: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF; cursor: pointer\">Vermerk akzeptieren</button>\n                </template>\n              </div>\n            </template>\n          </div>\n        </template>\n      </div>\n      </template>\n\n      <template data-k=\"if\" value=\"{{tabQa}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size: 13.5px; color: #5F6B7D\">Fragen der Teilnehmer, sortiert nach Unterst\u00fctzung. Anonyme Fragen ohne Namen.</div>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <template data-k=\"for\" list=\"{{qa}}\" as=\"q\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 14px; align-items: center; border-radius: 18px; background: {{q.bg}}; padding: 12px 14px\">\n              <span style=\"flex: none; width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; color: #2E4FB8; line-height: 1.1\"><span style=\"font-size: 11px\">\u25b2</span><span style=\"font-size: 17px\">{{q.votes}}</span></span>\n              <div style=\"flex: 1; min-width: 0\"><div style=\"font-size: 15px; line-height: 1.4; color: {{q.fg}}\">{{q.text}}</div><div style=\"font-size: 12.5px; color: #5F6B7D; margin-top: 3px\">{{q.meta}}</div></div>\n              <template data-k=\"if\" value=\"{{q.open}}\" hint-placeholder-val=\"{{ true }}\">\n                <button onClick=\"{{q.mail}}\" style=\"height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #3A4456; cursor: pointer\">Per Mail</button>\n                <button onClick=\"{{q.done}}\" style=\"height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #3D63DD; font: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF; cursor: pointer\">Beantwortet</button>\n              </template>\n              <template data-k=\"if\" value=\"{{q.closed}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #E6F4EC; color: #1E6A45; white-space: nowrap\">{{q.closedLabel}}</span></template>\n            </div>\n          </template>\n        </div>\n      </template>\n\n      <template data-k=\"if\" value=\"{{tabQuiz}}\" hint-placeholder-val=\"{{ false }}\">\n        <template data-k=\"if\" value=\"{{hasActive}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border-radius: 22px; background: #EAF0FE; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px\"><span style=\"font-size: 12px; font-weight: 700; color: #2E4FB8; letter-spacing: 0.03em\">L\u00c4UFT \u00b7 WISSENSCHECK</span><span style=\"font-size: 13px; font-weight: 600; color: #223C8F\">{{answeredLabel}}</span></div>\n            <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700\">{{active.q}}</div>\n            <template data-k=\"for\" list=\"{{bars}}\" as=\"b\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; flex-direction: column; gap: 5px\">\n                <div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span>{{b.text}} <strong style=\"color: #1E7A50\">{{b.mark}}</strong></span><span style=\"font-weight: 600\">{{b.n}}</span></div>\n                <div style=\"height: 12px; border-radius: 6px; background: #FFFFFF; overflow: hidden\"><div style=\"width: {{b.pct}}%; height: 12px; border-radius: 6px; background: {{b.color}}\"></div></div>\n              </div>\n            </template>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap\"><span style=\"font-size: 14px; color: #223C8F\"><strong>{{rightPct}} % richtig</strong> \u00b7 Ergebnis wird je Person im Nachweis vermerkt</span><button onClick=\"{{closePoll}}\" style=\"height: 42px; padding: 0 18px; border-radius: 999px; border: none; background: #FFFFFF; font: inherit; font-size: 13.5px; font-weight: 600; color: #1D2433; cursor: pointer\">Frage schlie\u00dfen</button></div>\n          </div>\n        </template>\n        <div style=\"font-size: 13.5px; color: #5F6B7D; margin-top: 4px\">Aus dem Fragenpool \u201eErste Hilfe\u201c oder spontan anlegen</div>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <template data-k=\"for\" list=\"{{pool}}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; gap: 12px; align-items: center; border-radius: 18px; background: #F8F9FC; padding: 12px 14px\">\n              <div style=\"flex: 1; min-width: 0\"><div style=\"font-size: 14.5px; font-weight: 500\">{{p.q}}</div><div style=\"font-size: 12.5px; color: #5F6B7D; margin-top: 2px\">{{p.meta}}</div></div>\n              <button onClick=\"{{p.send}}\" disabled=\"{{p.disabled}}\" style=\"height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: {{p.bg}}; color: {{p.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap\">{{p.label}}</button>\n            </div>\n          </template>\n          <button style=\"height: 46px; border-radius: 999px; border: 2px dashed #C9D1E0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #2E4FB8; cursor: pointer\">+ Spontane Frage anlegen</button>\n        </div>\n      </template>\n    </section>\n  </div>\n\n  <div style=\"display: flex; justify-content: flex-end; gap: 12px; align-items: center\">\n    <span style=\"font-size: 13.5px; color: #5F6B7D\">{{footHint}}</span>\n    <template data-k=\"if\" value=\"{{live}}\" hint-placeholder-val=\"{{ true }}\">\n      <button onClick=\"{{openEnd}}\" style=\"height: 54px; padding: 0 26px; border-radius: 999px; border: none; background: #1D2433; color: #FFFFFF; font: inherit; font-size: 15.5px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 24px rgba(29,36,51,0.22)\">Schulung offiziell beenden</button>\n    </template>\n    <template data-k=\"if\" value=\"{{ended}}\" hint-placeholder-val=\"{{ false }}\">\n      <button onClick=\"{{reopen}}\" style=\"height: 50px; padding: 0 22px; border-radius: 999px; border: none; background: #FFFFFF; color: #1D2433; font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(29,36,51,0.08)\">Demo zur\u00fccksetzen</button>\n    </template>\n  </div>\n\n  <template data-k=\"if\" value=\"{{confirmOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; background: rgba(29,36,51,0.3); display: flex; align-items: center; justify-content: center; padding: 24px\">\n      <section role=\"dialog\" aria-label=\"Schulung beenden\" style=\"width: 100%; max-width: 460px; background: #FFFFFF; border-radius: 30px; padding: 28px; box-shadow: 0 24px 60px rgba(29,36,51,0.25); display: flex; flex-direction: column; gap: 16px\">\n        <h2 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 21px; font-weight: 700\">Schulung jetzt offiziell beenden?</h2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3A4456\"><strong>{{stillIn}} Personen</strong> sind noch eingecheckt. F\u00fcr sie wird <strong>15:30</strong> als Ende \u00fcbernommen. Alle bekommen eine Nachricht, um ihre Teilnahme zu best\u00e4tigen. Danach werden beide QR-Codes deaktiviert.</p>\n        <div style=\"display: flex; gap: 10px\">\n          <button onClick=\"{{closeEnd}}\" style=\"flex: 1; height: 50px; border-radius: 999px; border: none; background: #F4F6FB; font: inherit; font-size: 15px; font-weight: 600; color: #1D2433; cursor: pointer\">Abbrechen</button>\n          <button onClick=\"{{doEnd}}\" style=\"flex: 1.3; height: 50px; border-radius: 999px; border: none; background: #3D63DD; font: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; cursor: pointer\">Jetzt beenden</button>\n        </div>\n      </section>\n    </div>\n  </template>\n</div>\n", "\nclass Component extends DCLogic {\n  P = [\n    { name: 'Anna Schulz', inT: '07:56', inM: 'QR', outT: '15:26', outM: 'Ende-QR' },\n    { name: 'Julia Becker', inT: '08:01', inM: 'QR', outT: '15:27', outM: 'Ende-QR' },\n    { name: 'Tobias Meier', inT: '07:58', inM: 'QR' },\n    { name: 'Kai Neumann', inT: '08:02', inM: 'QR' },\n    { name: 'Lea Wagner', inT: '08:02', inM: 'QR' },\n    { name: 'Paul Weber', inT: '08:05', inM: 'QR' },\n    { name: 'Mehmet Ayd\u0131n', inT: '07:59', inM: 'Tablet' },\n    { name: 'Sven Albrecht', inT: '08:03', inM: 'QR', outT: '12:53', outM: 'manuell', reason: 'Vorzeitig gegangen', note: 'Notdienst-Einsatz beim Kunden ab 13 Uhr' },\n    { name: 'Jonas Kr\u00fcger' }\n  ];\n  QA = [\n    { text: 'Wie oft muss der Defibrillator im Betrieb gepr\u00fcft werden?', votes: 5, who: 'Kai Neumann', at: '12:41' },\n    { text: 'Darf ich als Ersthelfer Medikamente ausgeben, z. B. Kopfschmerztabletten?', votes: 3, who: 'anonym', at: '13:10' },\n    { text: 'Gilt die stabile Seitenlage auch bei Verdacht auf Wirbels\u00e4ulenverletzung?', votes: 2, who: 'anonym', at: '10:22', answered: true },\n    { text: 'Wo h\u00e4ngt bei uns der n\u00e4chste Verbandkasten im Lager?', votes: 1, who: 'Paul Weber', at: '14:05' }\n  ];\n  POOL = [\n    { q: 'Was tust du bei einem Stromunfall zuerst?', opts: ['Sofort mit der Herzdruckmassage beginnen', 'Den Stromkreis unterbrechen', 'Die Person vom Ger\u00e4t wegziehen'], ok: 1, counts: [1, 4, 0] },\n    { q: 'Wie viele Herzdruckmassagen kommen auf zwei Beatmungen?', opts: ['15', '30', '50'], ok: 1, counts: [0, 0, 0] },\n    { q: 'Welche Notrufnummer gilt europaweit?', opts: ['110', '112', '116 117'], ok: 1, counts: [0, 0, 0] }\n  ];\n  state = { tab: 'end', ended: false, confirmOpen: false, review: {}, right: 'att', qa: {}, active: 0, sent: { 0: true }, closed: {} };\n  renderVals() {\n    const s = this.state;\n    const NOW = '15:28', END = '15:30';\n    const min = t => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));\n    const dur = m => Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');\n    const PLAN = 450;\n    const B = { blue: ['#EAF0FE', '#223C8F'], green: ['#E6F4EC', '#1E6A45'], amber: ['#FFF4DF', '#6B4500'], grey: ['#F4F6FB', '#5F6B7D'] };\n    let stillIn = 0, present = 0, outQr = 0, manual = 0, missing = 0;\n    const rows = this.P.map((p, i) => {\n      const ini = p.name.split(' ').map(w => w[0]).join('');\n      if (!p.inT) { missing++; return { name: p.name, ini, inT: '\u2013', inM: '', outT: '\u2013', outM: '', dur: '\u2013', status: s.ended ? 'nicht teilgenommen' : 'nicht eingecheckt', stBg: B.grey[0], stFg: B.grey[1], rowBg: 'transparent', hasNote: false }; }\n      let outT = p.outT, outM = p.outM, status, st;\n      if (!outT) { stillIn++; present++; if (s.ended) { outT = END; outM = 'offizielles Ende'; status = 'Best\u00e4tigung offen'; st = B.blue; } else { outT = '\u2013'; outM = ''; status = 'anwesend'; st = B.green; } }\n      else if (outM === 'manuell') { manual++; const r = s.review[i]; status = r === 'ok' ? 'Vermerk akzeptiert' : r === 'ask' ? 'R\u00fcckfrage gesendet' : 'Vermerk pr\u00fcfen'; st = r === 'ok' ? B.green : B.amber; }\n      else { outQr++; status = s.ended ? 'Best\u00e4tigung offen' : 'ausgecheckt'; st = s.ended ? B.blue : B.grey; }\n      const endMin = outT === '\u2013' ? min(NOW) : min(outT);\n      const m = endMin - min(p.inT);\n      return { name: p.name, ini, inT: p.inT, inM: p.inM, outT, outM, dur: dur(m) + (m < PLAN * 0.9 ? ' \u26a0' : ''), status, stBg: st[0], stFg: st[1],\n        rowBg: p.note ? '#FFFAF0' : '#F8F9FC', hasNote: !!p.note, reason: p.reason, note: p.note, open: !s.review[i],\n        accept: () => this.setState({ review: Object.assign({}, s.review, { [i]: 'ok' }) }),\n        ask: () => this.setState({ review: Object.assign({}, s.review, { [i]: 'ask' }) }) };\n    });\n    const N = 25;\n    const fin = (x, y, ox, oy) => { const dx = x - ox, dy = y - oy; if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null; const r = Math.max(Math.abs(dx - 3), Math.abs(dy - 3)); return r === 3 || r <= 1; };\n    const seed = s.tab === 'end' ? 7 : 3;\n    const qr = [];\n    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {\n      let v = fin(x, y, 0, 0); if (v === null) v = fin(x, y, N - 7, 0); if (v === null) v = fin(x, y, 0, N - 7);\n      if (v === null) v = (x < 8 && y < 8) || (x >= N - 8 && y < 8) || (x < 8 && y >= N - 8) ? false : ((x * seed + y * 13 + x * y * 3) % 5) < 2;\n
