<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestätigen und unterschreiben, interaktiv</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}

body{margin:0;background:#E9ECF2;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 0;box-sizing:border-box}
#root>*{box-shadow:0 20px 60px rgba(15,23,42,.18);border-radius:24px;overflow:hidden}
</style>
<script src="runtime.js"></script>
</head>
<body>
<div id="root"></div>
<script>
mountDC("\n\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FB; font-family: Inter, system-ui, sans-serif; color: #1D2433; display: flex; flex-direction: column\">\n  <header style=\"padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 12px\">\n    <div style=\"display: flex; align-items: center; gap: 10px\">\n      <a href=\"Viewer-Mobil.dc.html\" aria-label=\"Zur\u00fcck zur Schulung\" style=\"width: 44px; height: 44px; flex: none; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,36,51,0.06); display: flex; align-items: center; justify-content: center; color: #1D2433\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M11 3.5L5.5 9l5.5 5.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></a>\n      <h1 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 21px; font-weight: 700\">Fast geschafft</h1>\n    </div>\n    <ol aria-label=\"Fortschritt\" style=\"list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; font-size: 12.5px; font-weight: 600\">\n      <li style=\"flex: 1; padding: 9px 6px; border-radius: 999px; background: #E6F4EC; color: #1E6A45; text-align: center\">\u2713 14 Seiten</li>\n      <li style=\"flex: 1; padding: 9px 6px; border-radius: 999px; background: #E6F4EC; color: #1E6A45; text-align: center\">\u2713 Quiz</li>\n      <li style=\"flex: 1; padding: 9px 6px; border-radius: 999px; background: #3D63DD; color: #FFFFFF; text-align: center\">Unterschrift</li>\n    </ol>\n  </header>\n\n  <main style=\"flex: 1; min-height: 0; padding: 6px 16px; display: flex; flex-direction: column; gap: 12px\">\n    <label style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border-radius: 20px; padding: 16px; font-size: 14px; line-height: 1.55; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 8px 24px rgba(29,36,51,0.05); cursor: pointer\">\n      <input type=\"checkbox\" checked=\"{{agree}}\" onChange=\"{{toggleAgree}}\" style=\"width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: #3D63DD\">\n      <span>Ich habe die <strong>Sicherheitsunterweisung 2026</strong> (Version 3) vollst\u00e4ndig gelesen und verstanden. R\u00fcckfragen konnte ich an Dennis Hofmann richten.</span>\n    </label>\n\n    <div style=\"background: #FFFFFF; border-radius: 20px; padding: 14px 14px 12px; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 8px 24px rgba(29,36,51,0.05); display: flex; flex-direction: column; gap: 8px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 0 4px\">\n        <span style=\"font-size: 13px; font-weight: 600\">Deine Unterschrift</span>\n        <button onClick=\"{{clear}}\" style=\"font: inherit; font-size: 13px; font-weight: 600; color: #2E4FB8; background: #EAF0FE; border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer\">L\u00f6schen</button>\n      </div>\n      <div style=\"position: relative; height: 160px; border-radius: 16px; background: #F7F9FD\">\n        <template data-k=\"if\" value=\"{{empty}}\" hint-placeholder-val=\"{{ true }}\"><div aria-hidden=\"true\" style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8790A0; pointer-events: none\">Mit Finger oder Maus hier unterschreiben</div></template>\n        <div style=\"position: absolute; left: 18px; right: 18px; bottom: 38px; border-top: 1.5px dashed #C9D1E0; pointer-events: none\"></div>\n        <svg viewBox=\"0 0 326 160\" role=\"img\" aria-label=\"Unterschriftsfeld\" onPointerDown=\"{{down}}\" onPointerMove=\"{{move}}\" onPointerUp=\"{{up}}\" onPointerLeave=\"{{up}}\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair\"><path d=\"{{pathD}}\" fill=\"none\" stroke=\"#1D2433\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>\n      </div>\n      <div style=\"font-size: 12.5px; color: #5F6B7D; padding: 0 4px\">Lea Wagner \u00b7 Pers.-Nr. 1047</div>\n    </div>\n\n    <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5F6B7D; padding: 0 4px\">Zur Best\u00e4tigung: dein Passwort\n      <input type=\"password\" value=\"{{pw}}\" onChange=\"{{onPw}}\" placeholder=\"Passwort\" style=\"font: inherit; font-size: 15px; color: #1D2433; padding: 14px 16px; border: none; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 8px 24px rgba(29,36,51,0.05)\">\n    </label>\n  </main>\n\n  <footer style=\"padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 10px\">\n    <div style=\"text-align: center; font-size: 13px; color: {{hintColor}}; min-height: 18px\">{{hint}}</div>\n    <template data-k=\"if\" value=\"{{ready}}\" hint-placeholder-val=\"{{ false }}\">\n      <a href=\"Nachweis-PDF.dc.html\" style=\"display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #3D63DD; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 20px rgba(61,99,221,0.28)\">Verbindlich unterschreiben</a>\n    </template>\n    <template data-k=\"if\" value=\"{{notReady}}\" hint-placeholder-val=\"{{ true }}\">\n      <button disabled aria-disabled=\"true\" style=\"height: 56px; border-radius: 999px; border: none; font: inherit; font-size: 16px; font-weight: 600; background: #E4EAF8; color: #2E3F6E\">Verbindlich unterschreiben</button>\n    </template>\n  </footer>\n</div>\n", "\nclass Component extends DCLogic {\n  state = { agree: false, strokes: [], drawing: false, pw: '' };\n  point(e) {\n    const r = e.currentTarget.getBoundingClientRect();\n    return { x: (e.clientX - r.left) / r.width * 326, y: (e.clientY - r.top) / r.height * 160 };\n  }\n  renderVals() {\n    const s = this.state;\n    const pts = s.strokes.reduce((n, st) => n + st.length, 0);\n    const signed = pts > 8;\n    const pwOk = s.pw.length >= 4;\n    const ready = s.agree && signed && pwOk;\n    const missing = [];\n    if (!s.agree) missing.push('Best\u00e4tigung ankreuzen');\n    if (!signed) missing.push('unterschreiben');\n    if (!pwOk) missing.push('Passwort eingeben');\n    const pathD = s.strokes.map(st => st.length ? 'M' + st.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join('L') + (st.length === 1 ? 'l0.1 0' : '') : '').join(' ') || 'M0 0';\n    return {\n      agree: s.agree,\n      toggleAgree: () => this.setState({ agree: !s.agree }),\n      pw: s.pw,\n      onPw: e => this.setState({ pw: e.target.value }),\n      empty: s.strokes.length === 0,\n      pathD,\n      down: e => { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} const p = this.point(e); this.setState({ drawing: true, strokes: [...this.state.strokes, [p]] }); },\n      move: e => { if (!this.state.drawing) return; const p = this.point(e); const strokes = this.state.strokes.slice(); strokes[strokes.length - 1] = [...strokes[strokes.length - 1], p]; this.setState({ strokes }); },\n      up: () => { if (this.state.drawing) this.setState({ drawing: false }); },\n      clear: () => this.setState({ strokes: [] }),\n      ready, notReady: !ready,\n      hint: ready ? 'Alles bereit \u2013 Zeitpunkt und Dokumentversion werden gespeichert.' : 'Noch offen: ' + missing.join(', '),\n      hintColor: ready ? '#1E7A50' : '#5F6B7D'\n    };\n  }\n}\n");
</script>
</body>
</html>
