<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Präsenztermin QR-Check-in</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}

body{margin:0;background:#E9ECF2;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 0;box-sizing:border-box}
#root>*{box-shadow:0 20px 60px rgba(15,23,42,.18);}
</style>
<script src="runtime.js"></script>
</head>
<body>
<div id="root"></div>
<script>
mountDC("\n\n<div style=\"width: 1024px; height: 768px; box-sizing: border-box; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex\">\n  <section aria-label=\"Check-in\" style=\"width: 470px; background: #0F172A; color: #FFFFFF; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px\">\n    <div>\n      <div style=\"font-size: 13px; color: #94A3B8\">Pr\u00e4senztermin \u00b7 Trainer-Ansicht</div>\n      <h1 style=\"margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600\">Erste Hilfe Auffrischung</h1>\n      <div style=\"font-size: 14px; color: #CBD5E1; margin-top: 4px\">Do 04.12.2026 \u00b7 08:00\u201315:30 \u00b7 Schulungsraum Lager</div>\n    </div>\n    <div style=\"align-self: center; background: #FFFFFF; padding: 18px; border-radius: 14px\">\n      <div role=\"img\" aria-label=\"Check-in-QR-Code\" style=\"display: grid; grid-template-columns: repeat(25, 10px); grid-auto-rows: 10px; width: 250px\">\n        <template data-k=\"for\" list=\"{{cells}}\" as=\"c\" hint-placeholder-count=\"625\">\n          <div style=\"background: {{c.col}}\"></div>\n        </template>\n      </div>\n    </div>\n    <div style=\"display: flex; align-items: center; gap: 12px; justify-content: center\">\n      <svg width=\"34\" height=\"34\" viewBox=\"0 0 34 34\" aria-hidden=\"true\"><circle cx=\"17\" cy=\"17\" r=\"14\" fill=\"none\" stroke=\"#1E293B\" stroke-width=\"4\"/><circle cx=\"17\" cy=\"17\" r=\"14\" fill=\"none\" stroke=\"#7FA2FF\" stroke-width=\"4\" stroke-dasharray=\"88\" stroke-dashoffset=\"26\" transform=\"rotate(-90 17 17)\" stroke-linecap=\"round\"/></svg>\n      <div style=\"font-size: 14px; color: #CBD5E1\">Code wechselt in <strong style=\"color: #FFFFFF\">0:21</strong> \u00b7 Foto weiterleiten zwecklos</div>\n    </div>\n    <p style=\"margin: 0; text-align: center; font-size: 14px; line-height: 1.5; color: #CBD5E1\">Mit dem eigenen Handy scannen \u2013 oder rechts am Tablet den Namen antippen und unterschreiben.</p>\n  </section>\n\n  <section aria-label=\"Teilnehmerliste\" style=\"flex: 1; padding: 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center\">\n      <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Anwesenheit</h2>\n      <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600\">9 <span style=\"font-size: 15px; color: #5B6474; font-weight: 500\">/ 12 anwesend</span></span>\n    </div>\n    <ul style=\"list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden\">\n      <template data-k=\"for\" list=\"{{people}}\" as=\"p\" hint-placeholder-count=\"12\">\n        <li style=\"display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 44px; border-top: 1px solid #EEF0F3\">\n          <span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{p.dot}}; flex: none\"></span>\n          <span style=\"flex: 1; font-size: 14px; font-weight: 600\">{{p.name}}</span>\n          <span style=\"font-size: 13px; color: {{p.fg}}\">{{p.state}}</span>\n        </li>\n      </template>\n    </ul>\n    <div style=\"display: flex; gap: 12px; margin-top: auto\">\n      <button style=\"flex: 1; font: inherit; font-size: 15px; font-weight: 600; min-height: 50px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #0F172A\">Agenda abhaken (3/7)</button>\n      <button style=\"flex: 1.3; font: inherit; font-size: 15px; font-weight: 600; min-height: 50px; border-radius: 10px; border: none; background: #1F4FD8; color: #FFFFFF\">Termin abschlie\u00dfen &amp; gegenzeichnen</button>\n    </div>\n  </section>\n</div>\n", "\nclass Component extends DCLogic {\n  renderVals() {\n    const N = 25;\n    const finder = (x, y) => {\n      const f = (ox, oy) => {\n        const dx = x - ox, dy = y - oy;\n        if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;\n        const ring = Math.max(Math.abs(dx - 3), Math.abs(dy - 3));\n        return ring === 3 || ring <= 1;\n      };\n      const a = f(0, 0); if (a !== null) return a;\n      const b = f(N - 7, 0); if (b !== null) return b;\n      const c = f(0, N - 7); if (c !== null) return c;\n      if ((x === 7 || y === 7) && (x < 8 && y < 8)) return false;\n      if ((x === N - 8 && y < 8) || (y === 7 && x >= N - 8)) return false;\n      if ((y === N - 8 && x < 8) || (x === 7 && y >= N - 8)) return false;\n      return null;\n    };\n    const cells = [];\n    for (let y = 0; y < N; y++) {\n      for (let x = 0; x < N; x++) {\n        const fv = finder(x, y);\n        const on = fv !== null ? fv : (((x * 7 + y * 13 + x * y * 3) % 5) < 2);\n        cells.push({ col: on ? '#0F172A' : '#FFFFFF' });\n      }\n    }\n    const IN = { dot: '#157347', fg: '#157347' }, OUT = { dot: '#CBD5E1', fg: '#5B6474' };\n    const people = [\n      ['Anna Schulz', 'QR 07:48'], ['Tobias Meier', 'QR 07:51'], ['Lea Wagner', 'QR 07:52'], ['Mehmet Ayd\u0131n', 'Tablet 07:54'],\n      ['Sven Albrecht', 'QR 07:55'], ['Julia Becker', 'QR 07:57'], ['Kai Neumann', 'QR 07:58'], ['Dirk Hoffmann', 'Tablet 07:59'],\n      ['Sabine Roth', 'QR 08:03'], ['Jonas Kr\u00fcger', ''], ['Paul Weber', ''], ['Nina Lorenz', '']\n    ].map(([name, t]) => t ? { name, state: 'eingecheckt \u00b7 ' + t, ...IN } : { name, state: 'offen \u00b7 am Tablet unterschreiben', ...OUT });\n    return { cells, people };\n  }\n}\n");
</script>
</body>
</html>
