<div id="root"></div>
<script>
mountDC("\n\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FB; font-family: Inter, system-ui, sans-serif; color: #1D2433; display: flex; flex-direction: column\">\n  <header style=\"padding: 14px 16px 8px; display: flex; align-items: center; gap: 10px\">\n    <a href=\"Viewer-Start.dc.html\" aria-label=\"Zur\u00fcck\" style=\"width: 44px; height: 44px; flex: none; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,36,51,0.06); display: flex; align-items: center; justify-content: center; color: #1D2433\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M11 3.5L5.5 9l5.5 5.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></a>\n    <div><div style=\"font-size: 12px; color: #5F6B7D\">Meine Nachweise</div><h1 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700\">Externe Schulung einreichen</h1></div>\n  </header>\n\n  <template data-k=\"if\" value=\"{{isForm}}\" hint-placeholder-val=\"{{ true }}\">\n    <main style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"position: relative; background: #2A3142; border-radius: 26px; padding: 22px 26px 26px; display: flex; justify-content: center\">\n        <div style=\"width: 100%; background: #FFFDF8; border-radius: 6px; padding: 16px 18px; transform: rotate(-1.5deg); box-shadow: 0 10px 24px rgba(0,0,0,0.35); font-size: 10px; line-height: 1.5; color: #3A3A3A; position: relative\">\n          <div style=\"font-size: 8.5px; letter-spacing: 0.08em; color: #7A7A7A\">ERSTE-HILFE-AUSBILDUNG MUSTER E. V.</div>\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; margin-top: 6px; color: #1D2433\">Teilnahmebescheinigung</div>\n          <div style=\"margin-top: 8px\">Hiermit wird best\u00e4tigt, dass</div>\n          <div style=\"display: inline-block; font-size: 13px; font-weight: 700; color: #1D2433; outline: 2px solid #7FA2FF; outline-offset: 2px; border-radius: 3px; margin: 3px 0\">Lea Wagner</div>\n          <div>am <span style=\"outline: 2px solid #7FA2FF; outline-offset: 1px; border-radius: 3px; font-weight: 600\">04.12.2026</span> an der</div>\n          <div style=\"display: inline-block; font-weight: 700; color: #1D2433; outline: 2px solid #7FA2FF; outline-offset: 2px; border-radius: 3px; margin: 3px 0\">Erste-Hilfe-Fortbildung (9 UE)</div>\n          <div>gem\u00e4\u00df DGUV Grundsatz 304-001 teilgenommen hat.</div>\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-end; margin-top: 12px\"><span style=\"font-family: cursive; font-size: 13px; color: #34458A\">M. Muster</span><span style=\"width: 34px; height: 34px; border-radius: 50%; border: 2px solid #C0504D; color: #C0504D; font-size: 7px; font-weight: 700; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg)\">STEMPEL</span></div>\n        </div>\n        <span aria-hidden=\"true\" style=\"position: absolute; left: 12px; top: 12px; width: 22px; height: 22px; border-left: 3px solid #FFFFFF; border-top: 3px solid #FFFFFF; border-radius: 8px 0 0 0\"></span>\n        <span aria-hidden=\"true\" style=\"position: absolute; right: 12px; top: 12px; width: 22px; height: 22px; border-right: 3px solid #FFFFFF; border-top: 3px solid #FFFFFF; border-radius: 0 8px 0 0\"></span>\n        <span aria-hidden=\"true\" style=\"position: absolute; left: 12px; bottom: 12px; width: 22px; height: 22px; border-left: 3px solid #FFFFFF; border-bottom: 3px solid #FFFFFF; border-radius: 0 0 0 8px\"></span>\n        <span aria-hidden=\"true\" style=\"position: absolute; right: 12px; bottom: 12px; width: 22px; height: 22px; border-right: 3px solid #FFFFFF; border-bottom: 3px solid #FFFFFF; border-radius: 0 0 8px 0\"></span>\n      </div>\n      <div style=\"display: flex; gap: 8px\">\n        <button style=\"flex: 1; height: 44px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,36,51,0.06); font: inherit; font-size: 13.5px; font-weight: 600; color: #1D2433; cursor: pointer\">Neu fotografieren</button>\n        <button style=\"flex: 1; height: 44px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,36,51,0.06); font: inherit; font-size: 13.5px; font-weight: 600; color: #1D2433; cursor: pointer\">+ Weitere Seite</button>\n      </div>\n\n      <section aria-label=\"Erkannte Angaben\" style=\"background: #FFFFFF; border-radius: 24px; padding: 18px; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 8px 24px rgba(29,36,51,0.05); display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700\">Erkannt \u2013 bitte pr\u00fcfen</h2><span style=\"font-size: 12px; font-weight: 600; color: #1E6A45; background: #E6F4EC; padding: 5px 10px; border-radius: 999px\">\u2713 Name passt</span></div>\n        <label style=\"display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: #5F6B7D\">Kurs<input value=\"{{kurs}}\" onChange=\"{{onKurs}}\" style=\"font: inherit; font-size: 15px; color: #1D2433; height: 46px; padding: 0 14px; border: none; border-radius: 14px; background: #F4F6FB\"></label>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n          <label style=\"display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: #5F6B7D\">Datum<input value=\"04.12.2026\" style=\"font: inherit; font-size: 15px; color: #1D2433; height: 46px; padding: 0 14px; border: none; border-radius: 14px; background: #F4F6FB\"></label>\n          <label style=\"display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: #5F6B7D\">Umfang<input value=\"9 UE\" style=\"font: inherit; font-size: 15px; color: #1D2433; height: 46px; padding: 0 14px; border: none; border-radius: 14px; background: #F4F6FB\"></label>\n        </div>\n        <label style=\"display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: #5F6B7D\">Anbieter<input value=\"Erste-Hilfe-Ausbildung Muster e. V.\" style=\"font: inherit; font-size: 15px; color: #1D2433; height: 46px; padding: 0 14px; border: none; border-radius: 14px; background: #F4F6FB\"></label>\n        <div style=\"display: flex; align-items: center; gap: 10px; background: #EAF0FE; border-radius: 16px; padding: 12px 14px; font-size: 13.5px; color: #223C8F\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" aria-hidden=\"true\" style=\"flex: none\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#3D63DD\"/><path d=\"M6 10.3l2.6 2.6L14 7.6\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span>Wird angerechnet auf <strong>Ersthelfer</strong> \u2013 g\u00fcltig bis 04.12.2028</span></div>\n      </section>\n    </main>\n    <footer style=\"padding: 12px 16px 22px\">\n      <button onClick=\"{{submit}}\" style=\"width: 100%; height: 56px; border-radius: 999px; border: none; background: #3D63DD; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; box-shadow: 0 8px 20px rgba(61,99,221,0.28); cursor: pointer\">Zur Pr\u00fcfung einreichen</button>\n    </footer>\n  </template>\n\n  <template data-k=\"if\" value=\"{{isDone}}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"flex: 1; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 16px\">\n      <section style=\"background: #FFFFFF; border-radius: 28px; padding: 30px 22px; box-shadow: 0 10px 30px rgba(29,36,51,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px\">\n        <div style=\"width: 84px; height: 84px; border-radius: 50%; background: #E6F4EC; display: flex; align-items: center; justify-content: center\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M11 21l6 6 13-14\" fill=\"none\" stroke=\"#1E7A50\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div>\n        <h2 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 23px; font-weight: 700\">Eingereicht</h2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #3A4456\">Dein Nachweis \u201e{{kurs}}\u201c liegt jetzt bei Dennis Hofmann zur Pr\u00fcfung. Du bekommst eine Nachricht, sobald er freigegeben ist.</p>\n      </section>\n      <section aria-label=\"Status\" style=\"background: #FFFFFF; border-radius: 24px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 8px 24px rgba(29,36,51,0.05)\">\n        <ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column\">\n          <li style=\"display: flex; gap: 14px; align-items: flex-start; padding-bottom: 16px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 50%; background: #1E7A50; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center\">\u2713</span><div style=\"font-size: 14.5px\"><strong>Eingereicht</strong><div style=\"font-size: 12.5px; color: #5F6B7D\">heute, 21:04 \u00b7 Foto, 1 Seite</div></div></li>\n          <li style=\"display: flex; gap: 14px; align-items: flex-start; padding-bottom: 16px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 50%; background: #EAF0FE; border: 2px solid #3D63DD; box-sizing: border-box\"></span><div style=\"font-size: 14.5px\"><strong>In Pr\u00fcfung</strong><div style=\"font-size: 12.5px; color: #5F6B7D\">Schulungsverantwortlicher pr\u00fcft Beleg und Angaben</div></div></li>\n          <li style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F6FB; border: 2px solid #D9DFEA; box-sizing: border-box\"></span><div style=\"font-size: 14.5px; color: #5F6B7D\"><strong>Freigegeben</strong><div style=\"font-size: 12.5px\">Wird auf \u201eErsthelfer\u201c angerechnet</div></div></li>\n        </ol>\n      </section>\n    </main>\n    <footer style=\"padding: 12px 16px 22px\">\n      <button onClick=\"{{again}}\" style=\"width: 100%; height: 56px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,36,51,0.08); color: #1D2433; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer\">Weiteren Nachweis einreichen</button>\n    </footer>\n  </template>\n</div>\n", "\nclass Component extends DCLogic {\n  state = { step: 'form', kurs: 'Erste-Hilfe-Fortbildung' };\n  renderVals() {\n    const s = this.state;\n    return {\n      isForm: s.step === 'form', isDone: s.step === 'done',\n      kurs: s.kurs, onKurs: e => this.setState({ kurs: e.target.value }),\n      submit: () => this.setState({ step: 'done' }),\n      again: () => this.setState({ step: 'form' })\n    };\n  }\n}\n");
</script>
