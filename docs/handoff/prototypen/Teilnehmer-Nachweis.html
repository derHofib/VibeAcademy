: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center\">\n      <div><div style=\"font-weight: 600; font-size: 16px\">Sicherheitsunterweisung 2026 \u00b7 Version 3</div><div style=\"font-size: 12px; color: #5B6474; margin-top: 2px\">Dokument-Hash 9f3c\u2026a71e \u00b7 14 Seiten \u00b7 g\u00fcltig bis 05.11.2027</div></div>\n      <span style=\"padding: 6px 12px; border-radius: 999px; background: #E6F4EC; color: #157347; font-size: 13px; font-weight: 600\">\u2713 Gelesen, bestanden, unterschrieben</span>\n    </div>\n    <div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px\">\n      <div style=\"background: #F8FAFC; border-radius: 8px; padding: 10px 12px\"><div style=\"font-size: 12px; color: #5B6474\">Eingeladen</div><div style=\"font-size: 14px; font-weight: 600; margin-top: 2px\">03.11. 08:02</div></div>\n      <div style=\"background: #F8FAFC; border-radius: 8px; padding: 10px 12px\"><div style=\"font-size: 12px; color: #5B6474\">Erstmals ge\u00f6ffnet</div><div style=\"font-size: 14px; font-weight: 600; margin-top: 2px\">03.11. 12:47</div></div>\n      <div style=\"background: #F8FAFC; border-radius: 8px; padding: 10px 12px\"><div style=\"font-size: 12px; color: #5B6474\">Sitzungen</div><div style=\"font-size: 14px; font-weight: 600; margin-top: 2px\">3 (Handy, PC)</div></div>\n      <div style=\"background: #F8FAFC; border-radius: 8px; padding: 10px 12px\"><div style=\"font-size: 12px; color: #5B6474\">Lesezeit Ist / Soll</div><div style=\"font-size: 14px; font-weight: 600; margin-top: 2px\">11:48 / 6:22 min</div></div>\n      <div style=\"background: #F8FAFC; border-radius: 8px; padding: 10px 12px\"><div style=\"font-size: 12px; color: #5B6474\">Wissenscheck</div><div style=\"font-size: 14px; font-weight: 600; margin-top: 2px\">90 % \u00b7 2. Versuch</div></div>\n      <div style=\"background: #F8FAFC; border-radius: 8px; padding: 10px 12px\"><div style=\"font-size: 12px; color: #5B6474\">Unterschrift</div><div style=\"font-size: 14px; font-weight: 600; margin-top: 2px\">05.11. 07:16</div></div>\n    </div>\n  </section>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n    <section aria-label=\"Seitenprotokoll\" style=\"flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px\">\n      <div style=\"padding: 16px 20px; border-bottom: 1px solid #E3E6EB; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n        <h2 style=\"margin: 0; font-size: 16px; font-weight: 600\">Seitenprotokoll</h2>\n        <div style=\"display: flex; gap: 14px; font-size: 12px; color: #5B6474; align-items: center\"><span style=\"display: inline-flex; gap: 6px; align-items: center\"><span style=\"width: 14px; height: 6px; background: #1F4FD8; border-radius: 3px\"></span>Verweildauer</span><span style=\"display: inline-flex; gap: 6px; align-items: center\"><span style=\"width: 2px; height: 12px; background: #0F172A\"></span>Soll</span></div>\n      </div>\n      <div style=\"overflow-x: auto\">\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px\">\n          <thead><tr style=\"text-align: left; color: #5B6474; font-size: 12px\"><th style=\"padding: 10px 20px; font-weight: 600\">Seite</th><th style=\"padding: 10px 8px; font-weight: 600\">Erstmals gesehen</th><th style=\"padding: 10px 8px; font-weight: 600; width: 44%\">Verweildauer gegen Soll</th><th style=\"padding: 10px 8px; font-weight: 600\">Ist / Soll</th><th style=\"padding: 10px 20px 10px 8px; font-weight: 600\">Status</th></tr></thead>\n          <tbody>\n            <template data-k=\"for\" list=\"{{pages}}\" as=\"p\" hint-placeholder-count=\"14\">\n              <tr style=\"border-top: 1px solid #EEF0F3\">\n                <td style=\"padding: 7px 20px; font-weight: 600\">{{p.n}}</td>\n                <td style=\"padding: 7px 8px; color: #334155; white-space: nowrap\">{{p.seen}}</td>\n                <td style=\"padding: 7px 8px\"><div style=\"position: relative; height: 10px; background: #EEF0F3; border-radius: 5px\"><div style=\"width: {{p.w}}%; height: 10px; background: #1F4FD8; border-radius: 5px\"></div><div style=\"position: absolute; top: -3px; left: {{p.soll}}%; width: 2px; height: 16px; background: #0F172A\"></div></div></td>\n                <td style=\"padding: 7px 8px; color: #334155; white-space: nowrap\">{{p.ist}} / {{p.sollS}}</td>\n                <td style=\"padding: 7px 20px 7px 8px; color: #157347; font-weight: 600\">\u2713 erf\u00fcllt</td>\n              </tr>\n            </template>\n          </tbody>\n        </table>\n      </div>\n    </section>\n\n    <section aria-label=\"Audit-Trail\" style=\"flex: 1 1 340px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 16px 20px\">\n      <h2 style=\"margin: 0 0 6px; font-size: 16px; font-weight: 600\">Audit-Trail</h2>\n      <div style=\"font-size: 12px; color: #5B6474; margin-bottom: 10px\">Hash-Kette verifiziert \u00b7 Tagesanker 05.11. zeitgestempelt</div>\n      <ol style=\"list-style: none; margin: 0; padding: 0\">\n        <template data-k=\"for\" list=\"{{events}}\" as=\"e\" hint-placeholder-count=\"10\">\n          <li style=\"display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid #EEF0F3\">\n            <span style=\"width: 8px; height: 8px; border-radius: 50%; background: {{e.dot}}; margin-top: 6px; flex: none\"></span>\n            <div style=\"flex: 1; min-width: 0\"><div style=\"font-size: 13px; font-weight: 600\">{{e.what}}</div><div style=\"font-size: 12px; color: #5B6474\">{{e.when}} \u00b7 {{e.detail}}</div></div>\n          </li>\n        </template>\n      </ol>\n      <p style=\"margin: 12px 0 0; padding: 10px 12px; background: #F8FAFC; border-radius: 8px; font-size: 12px; color: #5B6474; line-height: 1.45\">Seitendetails sehen nur Schulungsverantwortliche und Auditoren. Vorgesetzte
