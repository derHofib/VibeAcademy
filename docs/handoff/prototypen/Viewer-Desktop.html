<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schulungsansicht Desktop mit Kapitel-Leiste und Lese-Dock</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}

body{margin:0}
#root>*{box-shadow:none;}
</style>

</head>
<body>
<div id="root"></div>
<script>
mountDC("\n\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #1D2433; background: #F4F6FB; min-height: 900px; position: relative; display: flex; flex-direction: column\">\n  <header style=\"padding: 18px 28px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px\">\n    <div style=\"display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 0\">\n      <a href=\"Viewer-Start.dc.html\" aria-label=\"Unterbrechen und schlie\u00dfen\" style=\"width: 44px; height: 44px; flex: none; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,36,51,0.06); display: flex; align-items: center; justify-content: center; color: #1D2433\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3.5 3.5l9 9M12.5 3.5l-9 9\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/></svg></a>\n      <div style=\"min-width: 0\"><div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 16px\">Sicherheitsunterweisung 2026</div><div style=\"font-size: 13px; color: #5F6B7D\">{{headSub}}</div></div>\n    </div>\n    <div style=\"flex: 1 1 320px; max-width: 460px; display: flex; flex-direction: column; gap: 7px\">\n      <div style=\"display: flex; gap: 4px\">\n        <template data-k=\"for\" list=\"{{segs}}\" as=\"g\" hint-placeholder-count=\"14\">\n          <div style=\"flex: 1; height: 6px; border-radius: 3px; background: #E3E8F2; overflow: hidden; box-shadow: {{g.ring}}\"><div style=\"width: {{g.fill}}%; height: 6px; border-radius: 3px; background: #3D63DD; transition: width 0.9s linear\"></div></div>\n        </template>\n      </div>\n      <div style=\"font-size: 12.5px; color: #5F6B7D\">{{doneCount}} von 14 Seiten erfasst</div>\n    </div>\n    <div style=\"flex: 1 1 220px; display: flex; justify-content: flex-end\">\n      <span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,36,51,0.05); font-size: 13px; color: {{statusColor}}\"><span style=\"width: 8px; height: 8px; border-radius: 50%; background: {{statusDot}}\"></span>{{statusText}}</span>\n    </div>\n  </header>\n\n  <div style=\"flex: 1; display: flex; gap: 32px; padding: 10px 28px 0; align-items: flex-start\">\n    <nav aria-label=\"Kapitel\" style=\"position: sticky; top: 20px; flex: none; width: 88px; background: #FFFFFF; border-radius: 44px; padding: 16px 0; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 10px 28px rgba(29,36,51,0.07); display: flex; flex-direction: column; align-items: center; gap: 6px\">\n      <template data-k=\"for\" list=\"{{rail}}\" as=\"c\" hint-placeholder-count=\"4\">\n        <button onClick=\"{{c.go}}\" disabled=\"{{c.disabled}}\" aria-label=\"{{c.aria}}\" style=\"width: 76px; border: none; border-radius: 26px; background: {{c.bg}}; padding: 8px 0 6px; font: inherit; color: {{c.fg}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: {{c.opacity}}\">\n          <span style=\"position: relative; width: 48px; height: 48px\">\n            <svg width=\"48\" height=\"48\" viewBox=\"0 0 48 48\" aria-hidden=\"true\"><circle cx=\"24\" cy=\"24\" r=\"20\" fill=\"#FFFFFF\" stroke=\"#E3E8F2\" stroke-width=\"4\"/><circle cx=\"24\" cy=\"24\" r=\"20\" fill=\"none\" stroke=\"{{c.ringColor}}\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"125.7\" stroke-dashoffset=\"{{c.offset}}\" transform=\"rotate(-90 24 24)\" style=\"transition: stroke-dashoffset 0.9s linear\"/></svg>\n            <span style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700\">{{c.mark}}</span>\n          </span>\n          <span style=\"font-size: 11px; font-weight: 600\">{{c.short}}</span>\n        </button>\n      </template>\n      <span style=\"width: 40px; height: 1px; background: #E3E8F2; margin: 6px 0\"></span>\n      <div aria-label=\"Wissenscheck {{quizState}}\" style=\"width: 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: {{quizFg}}\">\n        <span style=\"width: 44px; height: 44px; border-radius: 50%; background: {{quizBg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700\">{{quizMark}}</span>\n        <span style=\"font-size: 11px; font-weight: 600\">Quiz</span>\n      </div>\n      <div aria-label=\"Unterschrift {{signState}}\" style=\"width: 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: {{signFg}}\">\n        <span style=\"width: 44px; height: 44px; border-radius: 50%; background: {{signBg}}; display: flex; align-items: center; justify-content: center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 18c3-1 4-6 6-6s1 4 3 4 3-3 4-3 1 2 3 2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></span>\n        <span style=\"font-size: 11px; font-weight: 600\">Abschluss</span>\n      </div>\n    </nav>\n\n    <main style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 32px\">\n      <div style=\"width: 100%; max-width: 720px; background: #FFFFFF; border-radius: 30px; box-shadow: 0 1px 2px rgba(29,36,51,0.04), 0 12px 36px rgba(29,36,51,0.07); padding: 38px 52px 44px; box-sizing: border-box; min-height: 600px; display: flex; flex-direction: column; gap: 18px\">\n        <template data-k=\"if\" value=\"{{isRead}}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"align-self: flex-start; font-size: 13px; font-weight: 600; color: #2E4FB8; background: #EAF0FE; padding: 6px 12px; border-radius: 999px\">{{cur.num}} \u00b7 Seite {{pageNo}} von 14</span>\n          <h1 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: {{h1Size}}; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em\">{{cur.title}}</h1>\n          <p style=\"margin: 0; font-size: {{bodySize}}; line-height: 1.7; color: #3A4456\">{{cur.intro}}</p>\n          <template data-k=\"if\" value=\"{{hasItems}}\" hint-placeholder-val=\"{{ true }}\">\n            <ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px\">\n              <template data-k=\"for\" list=\"{{items}}\" as=\"it\" hint-placeholder-count=\"4\">\n                <li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: {{itemSize}}; line-height: 1.55\"><span style=\"flex: none; width: 30px; height: 30px; border-radius: 50%; background: #EAF0FE; color: #2E4FB8; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{it.mark}}</span><span style=\"padding-top: 3px\">{{it.text}}</span></li>\n              </template>\n            </ul>\n          </template>\n          <template data-k=\"if\" value=\"{{hasWarn}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; gap: 14px; align-items: flex-start; background: #FFF4DF; border-radius: 20px; padding: 16px 20px\">\n              <svg width=\"24\" height=\"22\" viewBox=\"0 0 22 20\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><path d=\"M9.3 2.6a2 2 0 013.4 0l7.6 13.2a2 2 0 01-1.7 3H3.4a2 2 0 01-1.7-3z\" fill=\"#F2B544\"/><path d=\"M11 7v5\" stroke=\"#5A3A00\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"11\" cy=\"15\" r=\"1.2\" fill=\"#5A3A00\"/></svg>\n              <div style=\"font-size: {{calloutSize}}; line-height: 1.55; color: #5A3A00\">{{cur.callout}}</div>\n            </div>\n          </template>\n          <template data-k=\"if\" value=\"{{hasInfo}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; gap: 14px; align-items: flex-start; background: #EAF0FE; border-radius: 20px; padding: 16px 20px\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 20 20\" aria-hidden=\"true\" style=\"flex: none; margin-top: 1px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#3D63DD\"/><path d=\"M10 9v5\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"10\" cy=\"6\" r=\"1.2\" fill=\"#FFFFFF\"/></svg>\n              <div style=\"font-size: {{calloutSize}}; line-height: 1.55; color: #223C8F\">{{cur.callout}}</div>\n            </div>\n          </template>\n        </template>\n\n        <template data-k=\"if\" value=\"{{isQuiz}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"font-size: 13px; font-weight: 600; color: #2E4FB8; background: #EAF0FE; padding: 6px 12px; border-radius: 999px\">Wissenscheck</span><span style=\"font-size: 13px; color: #5F6B7D\">Frage {{qNo}} von 3 \u00b7 Versuch {{attempt}}</span></div>\n          <h1 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; line-height: 1.3; font-weight: 700\">{{q.text}}</h1>\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <template data-k=\"for\" list=\"{{opts}}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button onClick=\"{{o.pick}}\" disabled=\"{{o.locked}}\" style=\"font: inherit; text-align: left; font-size: 16px; line-height: 1.4; padding: 16px 20px; min-height: 56px; border-radius: 20px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: #1D2433; cursor: pointer; opacity: {{o.opacity}}; display: flex; gap: 12px; align-items: center\"><span style=\"flex: 1\">{{o.text}}</span><span style=\"font-weight: 700; color: {{o.markColor}}\">{{o.mark}}</span></button>\n            </template>\n          </div>\n          <template data-k=\"if\" value=\"{{hasFeedback}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-radius: 20px; padding: 16px 20px; background: {{fbBg}}; color: {{fbFg}}; font-size: 15px; line-height: 1.55\"><strong>{{fbHead}}</strong> {{q.why}}</div>\n          </template>\n        </template>\n\n        <template data-k=\"if\" value=\"{{isResult}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 40px 0\">\n            <div style=\"width: 96px; height: 96px; border-radius: 50%; background: {{resBg}}; display: flex; align-items: center; justify-content: center\">\n              <template data-k=\"if\" value=\"{{passed}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M11 21l6 6 13-14\" fill=\"none\" stroke=\"#1E7A50\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></template>\n              <template data-k=\"if\" value=\"{{failed}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M20 11v12\" stroke=\"#8A4B00\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"20\" cy=\"29\" r=\"2.4\" fill=\"#8A4B00\"/></svg></template>\n            </div>\n            <h1 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 700\">{{resTitle}}</h1>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3A4456; max-width: 420px\">{{resText}}</p>\n          </div>\n        </template>\n      </div>\n\n      <nav aria-label=\"Lese-Dock\" style=\"position: sticky; bottom: 24px; margin-top: 24px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 2px 6px rgba(29,36,51,0.06), 0 16px 40px rgba(29,36,51,0.14); height: 76px; padding: 0 10px; display: flex; align-items: center; gap: 4px\">\n        <button onClick=\"{{toggleToc}}\" style=\"height: 56px; padding: 0 16px; border: none; border-radius: 999px; background: {{tocBtnBg}}; font: inherit; font-size: 14px; font-weight: 600; color: #1D2433; display: flex; align-items: center; gap: 8px; cursor: pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"6\" height=\"6\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"/><rect x=\"11\" y=\"3\" width=\"6\" height=\"6\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"/><rect x=\"3\" y=\"11\" width=\"6\" height=\"6\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"/><rect x=\"11\" y=\"11\" width=\"6\" height=\"6\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"/></svg>Inhalt</button>\n        <button onClick=\"{{back}}\" disabled=\"{{backDisabled}}\" style=\"height: 56px; padding: 0 16px; border: none; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #1D2433; display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: {{backOpacity}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M12 4.5L6.5 10l5.5 5.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>Zur\u00fcck</button>\n\n        <div style=\"width: 96px; display: flex; justify-content: center; margin-top: -34px\">\n          <template data-k=\"if\" value=\"{{showPrimaryBtn}}\" hint-placeholder-val=\"{{ true }}\">\n            <button onClick=\"{{primary}}\" disabled=\"{{primaryDisabled}}\" aria-label=\"{{primaryLabel}}\" title=\"{{primaryLabel}}\" style=\"position: relative; box-sizing: border-box; width: 84px; height: 84px; border-radius: 50%; border: 6px solid #F4F6FB; padding: 0; background: {{centerBg}}; color: {{centerFg}}; box-shadow: 0 12px 28px rgba(61,99,221,{{centerShadow}}); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s, color 0.3s\">\n              <svg width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" aria-hidden=\"true\" style=\"position: absolute; inset: 0\"><circle cx=\"36\" cy=\"36\" r=\"32\" fill=\"none\" stroke=\"{{ringTrack}}\" stroke-width=\"4\"/><circle cx=\"36\" cy=\"36\" r=\"32\" fill=\"none\" stroke=\"#3D63DD\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"201.1\" stroke-dashoffset=\"{{ringOffset}}\" transform=\"rotate(-90 36 36)\" style=\"transition: stroke-dashoffset 0.9s linear\"/></svg>\n              <template data-k=\"if\" value=\"{{cCount}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"position: relative; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; line-height: 1\">{{left}}<span style=\"font-size: 12px; font-weight: 600\">s</span></span></template>\n              <template data-k=\"if\" value=\"{{cArrow}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"position: relative\"><path d=\"M5 12h13M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></template>\n              <template data-k=\"if\" value=\"{{cRetry}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"position: relative\"><path d=\"M19 12a7 7 0 11-2.1-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\"/><path d=\"M17.5 3v4.2h-4.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></template>\n              <template data-k=\"if\" value=\"{{cWait}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position: relative; font-size: 24px; font-weight: 700\">?</span></template>\n            </button>\n          </template>\n          <template data-k=\"if\" value=\"{{showSignLink}}\" hint-placeholder-val=\"{{ false }}\">\n            <a href=\"Abschluss-Signatur.dc.html\" aria-label=\"Weiter zur Unterschrift\" title=\"Weiter zur Unterschrift\" style=\"box-sizing: border-box; width: 84px; height: 84px; border-radius: 50%; border: 6px solid #F4F6FB; background: #1E7A50; color: #FFFFFF; box-shadow: 0 12px 28px rgba(30,122,80,0.35); display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 18c3-1 4-6 6-6s1 4 3 4 3-3 4-3 1 2 3 2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></a>\n          </template>\n        </div>\n\n        <button onClick=\"{{toggleAsk}}\" style=\"height: 56px; padding: 0 16px; border: none; border-radius: 999px; background: {{askBtnBg}}; font: inherit; font-size: 14px; font-weight: 600; color: #1D2433; display: flex; align-items: center; gap: 8px; cursor: pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M3 5a2 2 0 012-2h10a2 2 0 012 2v7a2 2 0 01-2 2H8.5L5 17v-3a2 2 0 01-2-2z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/></svg>Frage</button>\n        <div role=\"group\" aria-label=\"Schriftgr\u00f6\u00dfe\" style=\"display: flex; align-items: center; height: 56px; border-radius: 999px; background: #F4F6FB; padding: 0 4px\">\n          <button onClick=\"{{zoomOut}}\" aria-label=\"Schrift kleiner\" style=\"width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; font: inherit; font-size: 13px; font-weight: 700; color: #1D2433; cursor: pointer\">A\u2212</button>\n          <span style=\"min-width: 44px; text-align: center; font-size: 12px; color: #5F6B7D\">{{zoomLabel}}</span>\n          <button onClick=\"{{zoomIn}}\" aria-label=\"Schrift gr\u00f6\u00dfer\" style=\"width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; font: inherit; font-size: 16px; font-weight: 700; color: #1D2433; cursor: pointer\">A+</button>\n        </div>\n      </nav>\n    </main>\n  </div>\n\n  <template data-k=\"if\" value=\"{{tocOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <section role=\"dialog\" aria-label=\"Inhaltsverzeichnis\" style=\"position: absolute; left: 136px; top: 92px; width: 340px; max-height: 640px; overflow-y: auto; background: #FFFFFF; border-radius: 28px; box-shadow: 0 2px 6px rgba(29,36,51,0.06), 0 24px 56px rgba(29,36,51,0.18); padding: 18px 12px 16px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 0 8px 4px\">\n        <h2 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700\">Inhalt</h2>\n        <button onClick=\"{{closePanel}}\" style=\"font: inherit; font-size: 13px; font-weight: 600; color: #2E4FB8; background: #EAF0FE; border: none; border-radius: 999px; padding: 9px 14px; cursor: pointer\">Schlie\u00dfen</button>\n      </div>\n      <template data-k=\"for\" list=\"{{toc}}\" as=\"r\" hint-placeholder-count=\"18\">\n        <template data-k=\"if\" value=\"{{r.header}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 11.5px; font-weight: 700; color: #5F6B7D; padding: 14px 10px 4px; letter-spacing: 0.03em\">{{r.text}}</div></template>\n        <template data-k=\"if\" value=\"{{r.isPage}}\" hint-placeholder-val=\"{{ true }}\"><button onClick=\"{{r.go}}\" disabled=\"{{r.disabled}}\" style=\"width: 100%; font: inherit; text-align: left; display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; border: none; border-radius: 14px; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; cursor: pointer\"><span style=\"flex: 1\">{{r.text}}</span><span style=\"font-size: 12px; font-weight: 600; color: {{r.sColor}}\">{{r.status}}</span></button></template>\n      </template>\n    </section>\n  </template>\n\n  <template data-k=\"if\" value=\"{{askOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <section role=\"dialog\" aria-label=\"Frage stellen\" style=\"position: absolute; right: 28px; top: 92px; width: 340px; background: #FFFFFF; border-radius: 28px; box-shadow: 0 2px 6px rgba(29,36,51,0.06), 0 24px 56px rgba(29,36,51,0.18); padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center\">\n        <h2 style=\"margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; font-weight: 700\">Frage zu {{askRef}}</h2>\n        <button onClick=\"{{closePanel}}\" style=\"font: inherit; font-size: 13px; font-weight: 600; color: #2E4FB8; background: #EAF0FE; border: none; border-radius: 999px; padding: 9px 14px; cursor: pointer\">Schlie\u00dfen</button>\n      </div>\n      <div style=\"display: flex; gap: 12px; align-items: center\"><span aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 50%; background: #EAF0FE; color: #2E4FB8; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center\">DH</span><div><div style=\"font-size: 14px; font-weight: 600\">Dennis Hofmann</div><div style=\"font-size: 12.5px; color: #5F6B7D\">Unterweisender \u00b7 antwortet per Mail</div></div></div>\n      <template data-k=\"if\" value=\"{{askForm}}\" hint-placeholder-val=\"{{ true }}\">\n        <textarea rows=\"4\" aria-label=\"Deine Frage\" value=\"{{question}}\" onChange=\"{{onQuestion}}\" placeholder=\"Was ist unklar?\" style=\"font: inherit; font-size: 14.5px; color: #1D2433; padding: 12px 14px; border: none; border-radius: 18px; background: #F4F6FB; resize: none\"></textarea>\n        <button onClick=\"{{send}}\" disabled=\"{{sendDisabled}}\" style=\"height: 46px; border-radius: 999px; border: none; font: inherit; font-size: 14.5px; font-weight: 600; background: {{sendBg}}; color: #FFFFFF; cursor: pointer\">Frage senden</button>\n      </template>\n      <template data-k=\"if\" value=\"{{askSent}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #E6F4EC; color: #1E5A3C; border-radius: 18px; padding: 14px 16px; font-size: 14px; line-height: 1.5\">Gesendet \u2013 die Frage wird im Nachweis vermerkt. Du kannst weiterlesen.</div>\n      </template>\n      <div style=\"font-size: 12px; line-height: 1.5; color: #5F6B7D\">Erfasst wird nur, welche Seite wie lange sichtbar war. Wechselst du den Tab, pausiert die Erfassung.</div>\n    </section>\n  </template>\n</div>\n", "\nclass Component extends DCLogic {\nCH = ['Grundlagen und Verantwortung', 'Elektrische Gef\u00e4hrdungen', 'Brand- und Explosionsschutz', 'Erste Hilfe und Notfall'];\nPAGES = [\n  { ch: 0, num: '1.1', t: 5, title: 'Warum diese Unterweisung?', intro: 'Einmal im Jahr frischen wir gemeinsam auf, welche Gefahren bei unserer Arbeit bestehen und wie wir uns sch\u00fctzen. Die Unterweisung ist gesetzlich vorgeschrieben.', items: ['Gefahren auf Baustelle und an Ladeinfrastruktur erkennen', 'Im Notfall richtig handeln', 'Rechte und Pflichten kennen'], kind: 'info', callout: 'Lies in Ruhe \u2013 du kannst jederzeit unterbrechen. Dein Fortschritt bleibt gespeichert.' },\n  { ch: 0, num: '1.2', t: 6, title: 'Pflichten auf beiden Seiten', intro: 'Arbeitsschutz funktioniert nur, wenn alle mitmachen.', items: ['Der Betrieb beurteilt Gef\u00e4hrdungen, unterweist und stellt Schutzausr\u00fcstung bereit.', 'Du befolgst Weisungen und benutzt die Schutzausr\u00fcstung bestimmungsgem\u00e4\u00df.', 'Du meldest M\u00e4ngel und gef\u00e4hrliche Situationen sofort deiner F\u00fchrungskraft.'] },\n  { ch: 0, num: '1.3', t: 6, title: 'Pers\u00f6nliche Schutzausr\u00fcstung', intro: 'PSA ist die letzte Schutzebene. Sie wirkt nur, wenn sie passt und intakt ist.', items: ['Sicherheitsschuhe auf jeder Baustelle', 'Schutzhelm bei Gefahr von Kopfverletzungen', 'Bei St\u00f6rlichtbogengefahr Gesichtsschutz und Schutzkleidung', 'Isolierende Handschuhe nach Arbeitsanweisung'], kind: 'warn', callout: 'Besch\u00e4digte PSA nicht benutzen \u2013 sofort austauschen lassen.' },\n  { ch: 1, num: '2.1', t: 5, title: 'Gefahren durch elektrischen Strom', intro: 'Strom ist unsichtbar. Gef\u00e4hrlich wird er durch K\u00f6rperdurchstr\u00f6mung, St\u00f6rlichtb\u00f6gen und Folgeunf\u00e4lle.', items: ['Durchstr\u00f6mung: Verkrampfung, Herzrhythmusst\u00f6rungen, Verbrennungen', 'St\u00f6rlichtbogen: extreme Hitze, Blendung, Druckwelle', 'Folgeunf\u00e4lle: zum Beispiel Sturz von der Leiter'] },\n  { ch: 1, num: '2.2', t: 6, title: 'Wirkung auf den K\u00f6rper', intro: 'Schon wenige zehn Milliampere durch den K\u00f6rper k\u00f6nnen Herzkammerflimmern ausl\u00f6sen. Entscheidend sind Stromst\u00e4rke, Weg durch den K\u00f6rper und Einwirkdauer.', items: [], kind: 'warn', callout: 'Nach jedem Stromunfall \u00e4rztlich untersuchen lassen \u2013 auch wenn du dich gut f\u00fchlst. Rhythmusst\u00f6rungen k\u00f6nnen verz\u00f6gert auftreten.' },\n  { ch: 1, num: '2.3', t: 6, title: 'Schutzma\u00dfnahmen im Alltag', intro: 'Die meisten Unf\u00e4lle passieren an Ger\u00e4ten, die man t\u00e4glich nutzt.', items: ['Ger\u00e4te vor Benutzung auf sichtbare Sch\u00e4den pr\u00fcfen', 'Pr\u00fcfplakette beachten \u2013 abgelaufen hei\u00dft: nicht benutzen', 'Auf Baustellen nur \u00fcber Fehlerstrom-Schutzeinrichtung (RCD) arbeiten', 'Defekte Ger\u00e4te kennzeichnen und aussortieren'] },\n  { ch: 1, num: '2.4', t: 8, title: 'Die f\u00fcnf Sicherheitsregeln', intro: 'Vor jeder Arbeit an elektrischen Anlagen \u2013 immer in dieser Reihenfolge:', numbered: true, items: ['Freischalten', 'Gegen Wiedereinschalten sichern', 'Spannungsfreiheit allpolig feststellen', 'Erden und kurzschlie\u00dfen', 'Benachbarte, unter Spannung stehende Teile abdecken oder abschranken'], kind: 'warn', callout: 'Spannungspr\u00fcfer vor und nach der Messung auf Funktion pr\u00fcfen.' },\n  { ch: 1, num: '2.5', t: 6, title: 'Arbeiten unter Spannung', intro: 'Arbeiten an unter Spannung stehenden Teilen sind grunds\u00e4tzlich verboten.', items: ['Ausnahmen nur mit besonderer Ausbildung, schriftlichem Auftrag und geeigneter Ausr\u00fcstung', 'Im Zweifel: freischalten und die F\u00fchrungskraft fragen'], kind: 'warn', callout: 'Zeitdruck ist nie ein Grund, unter Spannung zu arbeiten.' },\n  { ch: 2, num: '3.1', t: 5, title: 'Br\u00e4nde vermeiden', intro: 'Viele Br\u00e4nde entstehen durch Unachtsamkeit.', items: ['Ordnung halten, Brennbares von Z\u00fcndquellen fernhalten', 'Schwei\u00df-, Schneid- und Trennarbeiten nur mit Erlaubnisschein', 'Kabeltrommeln vollst\u00e4ndig abrollen, Mehrfachsteckdosen nicht \u00fcberlasten'] },\n  { ch: 2, num: '3.2', t: 6, title: 'Feuerl\u00f6scher richtig einsetzen', intro: 'Kenne die Standorte der Feuerl\u00f6scher an deinem Arbeitsplatz und im Fahrzeug.', items: ['Feuer in Windrichtung angreifen', 'Von vorne nach hinten und von unten nach oben l\u00f6schen', 'Mehrere L\u00f6scher gleichzeitig statt nacheinander einsetzen'], kind: 'warn', callout: 'Brennende Lithium-Ionen-Akkus: Abstand halten, Feuerwehr rufen, Bereich absperren.' },\n  { ch: 2, num: '3.3', t: 6, title: 'Verhalten im Brandfall', intro: 'Ruhe bewahren und in dieser Reihenfolge handeln:', numbered: true, items: ['Melden \u2013 Notruf 112', 'Retten \u2013 Personen warnen und in Sicherheit bringen', 'L\u00f6schen \u2013 nur ohne dich selbst zu gef\u00e4hrden', 'Sammelplatz aufsuchen und Vollz\u00e4hligkeit melden'] },\n  { ch: 3, num: '4.1', t: 5, title: 'Notruf absetzen', intro: 'Notruf 112 \u2013 die Leitstelle f\u00fchrt dich durch das Gespr\u00e4ch.', items: ['Wo ist es passiert?', 'Was ist passiert?', 'Wie viele Verletzte?', 'Welche Verletzungen?', 'Warten auf R\u00fcckfragen \u2013 nicht auflegen'] },\n  { ch: 3, num: '4.2', t: 6, title: 'Erste Hilfe beim Stromunfall', intro: 'Bei einem Stromunfall gilt:', numbered: true, items: ['Eigenschutz: Stromkreis unterbrechen, erst dann die Person ber\u00fchren', 'Bewusstsein und Atmung pr\u00fcfen', 'Keine normale Atmung: Notruf, Herzdruckmassage, Defibrillator holen lassen'], kind: 'warn', callout: 'Niemals eine Person ber\u00fchren, die noch mit dem Stromkreis verbunden ist.' },\n  { ch: 3, num: '4.3', t: 5, title: 'Ersthelfer und Verbandbuch', intro: 'Wisse, wer in deinem Team Ersthelfer ist und wo Verbandkasten und Defibrillator h\u00e4ngen.', items: ['Jede Erste-Hilfe-Leistung ins Verbandbuch \u2013 auch kleine Verletzungen', 'Die Ersthelfer-Liste h\u00e4ngt aus und steht in der App'], kind: 'info', callout: 'Geschafft! Als N\u00e4chstes folgt ein kurzer Wissenscheck.' }\n];\nQUIZ = [\n  { text: 'Welche Sicherheitsregel folgt direkt auf \u201eFreischalten\u201c?', opts: ['Erden und kurzschlie\u00dfen', 'Gegen Wiedereinschalten sichern', 'Spannungsfreiheit feststellen'], ok: 1, why: 'Erst sichern, dann pr\u00fcfen: So kann niemand die Anlage versehentlich wieder einschalten.' },\n  { text: 'Was tust du bei einem Stromunfall zuerst?', opts: ['Sofort mit der Herzdruckmassage beginnen', 'Die Person vom Ger\u00e4t wegziehen', 'Den Stromkreis unterbrechen'], ok: 2, why: 'Eigenschutz zuerst \u2013 sonst wirst du selbst durchstr\u00f6mt.' },\n  { text: 'Wie oft muss die Sicherheitsunterweisung mindestens stattfinden?', opts: ['Einmal j\u00e4hrlich', 'Alle zwei Jahre', 'Nur bei der Einstellung'], ok: 0, why: 'DGUV Vorschrift 1 verlangt die Unterweisung mindestens einmal j\u00e4hrlich.' }\n];\n  state = { page: 0, dwell: this.PAGES.map(() => 0), view: 'read', panel: null, hidden: false, qi: 0, picked: null, score: 0, attempt: 1, question: '', sent: false, zoom: 1 };\n  componentDidMount() { this.timer = setInterval(() => this.tick(), 1000); }\n  componentWillUnmount() { clearInterval(this.timer); }\n  tick() {\n    const { PAGES } = this;\n    const s = this.state;\n    const hidden = typeof document !== 'undefined' && document.visibilityState === 'hidden';\n    if (hidden !== s.hidden) this.setState({ hidden });\n    if (hidden || s.view !== 'read') return;\n    const p = s.page;\n    if (s.dwell[p] >= PAGES[p].t) return;\n    const dwell = s.dwell.slice();\n    dwell[p] += 1;\n    this.setState({ dwell });\n  }\n  renderVals() {\n    const { CH, PAGES, QUIZ } = this;\n    const s = this.state;\n    const ful = i => s.dwell[i] >= PAGES[i].t;\n    const firstOpen = (() => { const k = PAGES.findIndex((_, i) => !ful(i)); return k === -1 ? PAGES.length : k; })();\n    const allRead = firstOpen === PAGES.length;\n    const p = s.page, cur = PAGES[p];\n    const left = Math.max(0, cur.t - s.dwell[p]);\n    const curDone = ful(p);\n    const doneCount = PAGES.filter((_, i) => ful(i)).length;\n    const isRead = s.view === 'read', isQuiz = s.view === 'quiz', isResult = s.view === 'result';\n    const passed = isResult && s.score === QUIZ.length;\n    const segs = PAGES.map((pg, i) => ({ fill: Math.min(100, Math.round(s.dwell[i] / pg.t * 100)), ring: i === p && isRead ? '0 0 0 2px #C9D6F8' : 'none' }));\n    const go = i => () => this.setState({ page: i, view: 'read', panel: null });\n\n    const SHORT = ['Basis', 'Strom', 'Brand', 'Notfall'];\n    const rail = CH.map((name, c) => {\n      const idx = PAGES.map((pg, i) => (pg.ch === c ? i : -1)).filter(i => i >= 0);\n      const frac = idx.reduce((a, i) => a + Math.min(1, s.dwell[i] / PAGES[i].t), 0) / idx.length;\n      const complete = idx.every(ful);\n      const target = idx.find(i => !ful(i) && i <= firstOpen);\n      const dest = target !== undefined ? target : idx[0];\n      const reachable = idx[0] <= firstOpen;\n      const active = isRead && cur.ch === c;\n      return { short: SHORT[c], mark: complete ? '\u2713' : String(c + 1), go: go(dest), disabled: !reachable,\n        aria: 'Kapitel ' + (c + 1) + ': ' + name + (complete ? ', erledigt' : ''),\n        offset: (125.7 * (1 - frac)).toFixed(1), ringColor: complete ? '#1E7A50' : '#3D63DD',\n        bg: active ? '#EAF0FE' : 'transparent', fg: active ? '#2E4FB8' : complete ? '#1E6A45' : '#1D2433', opacity: reachable ? 1 : 0.45 };\n    });\n\n    const toc = [];\n    CH.forEach((name, c) => {\n      toc.push({ header: true, isPage: false, text: (c + 1) + ' \u00b7 ' + name.toUpperCase() });\n      PAGES.forEach((pg, i) => {\n        if (pg.ch !== c) return;\n        const locked = i > firstOpen;\n        toc.push({ header: false, isPage: true, text: pg.num + '  ' + pg.title, go: go(i), disabled: locked,\n          status: ful(i) ? '\u2713' : i === p && isRead ? 'aktuell' : locked ? 'gesperrt' : '',\n          sColor: ful(i) ? '#1E7A50' : i === p ? '#2E4FB8' : '#8790A0',\n          bg: i === p && isRead ? '#EAF0FE' : 'transparent', fg: locked ? '#9AA3B2' : '#1D2433' });\n      });\n    });\n\n    let statusText = '', statusColor = '#3A4456', statusDot = '#3D63DD';\n    if (isRead) {\n      if (s.hidden) { statusText = 'Pausiert \u2013 Fenster nicht aktiv'; statusDot = '#F2B544'; }\n      else if (curDone) { statusText = 'Seite ' + (p + 1) + ' erfasst'; statusColor = '#1E6A45'; statusDot = '#1E7A50'; }\n      else statusText = 'Seite wird erfasst \u00b7 noch ' + left + ' s';\n    } else if (isQuiz) statusText = s.picked === null ? 'W\u00e4hle eine Antwort' : 'Weiter mit dem Pfeil';\n    else { statusText = passed ? 'Bestanden \u2013 jetzt unterschreiben' : 'Noch nicht bestanden'; statusColor = passed ? '#1E6A45' : '#6B4500'; statusDot = passed ? '#1E7A50' : '#F2B544'; }\n\n    let primaryLabel = '', primaryDisabled = false, frac = 0, mode = 'arrow', primary = () => {};\n    if (isRead) {\n      primaryDisabled = !curDone;\n      frac = curDone ? 1 : s.dwell[p] / cur.t;\n      mode = curDone ? 'arrow' : 'count';\n      primaryLabel = !curDone ? 'Weiter in ' + left + ' Sekunden' : p === PAGES.length - 1 ? 'Zum Wissenscheck' : 'N\u00e4chste Seite';\n      primary = () => { if (!curDone) return; if (p === PAGES.length - 1) this.setState({ view: 'quiz', qi: 0, picked: null, score: 0 }); else this.setState({ page: p + 1 }); };\n    } else if (isQuiz) {\n      primaryDisabled = s.picked === null;\n      frac = (s.qi + (s.picked === null ? 0 : 1)) / QUIZ.length;\n      mode = s.picked === null ? 'wait' : 'arrow';\n      primaryLabel = s.qi === QUIZ.length - 1 ? 'Auswerten' : 'N\u00e4chste Frage';\n      primary = () => { if (s.picked === null) return; if (s.qi === QUIZ.length - 1) this.setState({ view: 'result' }); else this.setState({ qi: s.qi + 1, picked: null }); };\n    } else if (!passed) {\n      mode = 'retry'; frac = 1;\n      primaryLabel = 'Erneut versuchen';\n      primary = () => this.setState({ view: 'quiz', qi: 0, picked: null, score: 0, attempt: s.attempt + 1 });\n    }\n    const active = !primaryDisabled;\n\n    const q = QUIZ[s.qi];\n    const opts = q.opts.map((text, k) => {\n      const answered = s.picked !== null, isOk = k === q.ok, isPicked = k === s.picked;\n      let border = '#E3E8F2', bg = '#FFFFFF', mark = '', markColor = '#1E7A50', opacity = 1;\n      if (answered) {\n        if (isOk) { border = '#9ED3B5'; bg = '#E6F4EC'; mark = '\u2713'; }\n        else if (isPicked) { border = '#F0C08A'; bg = '#FFF4DF'; mark = '\u2715'; markColor = '#8A4B00'; }\n        else opacity = 0.55;\n      }\n      return { text, border, bg, mark, markColor, opacity, locked: answered,\n        pick: () => { if (s.picked !== null) return; this.setState({ picked: k, score: s.score + (k === q.ok ? 1 : 0) }); } };\n    });\n    const right = s.picked !== null && s.picked === q.ok;\n    const z = s.zoom;\n    const px = n => (Math.round(n * z * 10) / 10) + 'px';\n\n    return {\n      headSub: isRead ? 'Kapitel ' + (cur.ch + 1) + ' \u00b7 ' + CH[cur.ch] : isQuiz ? 'Wissenscheck' : 'Ergebnis',\n      segs, doneCount, cur, pageNo: p + 1, rail, toc,\n      isRead, isQuiz, isResult,\n      items: (cur.items || []).map((text, k) => ({ text, mark: cur.numbered ? String(k + 1) : '\u2022' })),\n      hasItems: (cur.items || []).length > 0, hasWarn: cur.kind === 'warn', hasInfo: cur.kind === 'info',\n      h1Size: px(30), bodySize: px(17), itemSize: px(16.5), calloutSize: px(15.5),\n      zoomLabel: Math.round(z * 100) + ' %',\n      zoomIn: () => this.setState({ zoom: Math.min(1.3, Math.round((z + 0.1) * 10) / 10) }),\n      zoomOut: () => this.setState({ zoom: Math.max(0.9, Math.round((z - 0.1) * 10) / 10) }),\n      statusText, statusColor, statusDot,\n      quizMark: passed ? '\u2713' : allRead ? '?' : '\u2013', quizState: passed ? 'bestanden' : allRead ? 'freigeschaltet' : 'gesperrt',\n      quizBg: passed ? '#E6F4EC' : allRead ? '#EAF0FE' : '#F4F6FB', quizFg: passed ? '#1E6A45' : allRead ? '#2E4FB8' : '#8790A0',\n      signState: passed ? 'freigeschaltet' : 'gesperrt',\n      signBg: passed ? '#E6F4EC' : '#F4F6FB', signFg: passed ? '#1E6A45' : '#8790A0',\n      back: () => { if (isRead && p > 0) this.setState({ page: p - 1 }); else if (!isRead) this.setState({ view: 'read', page: PAGES.length - 1 }); },\n      backDisabled: isRead && p === 0, backOpacity: isRead && p === 0 ? 0.35 : 1,\n      showPrimaryBtn: !(isResult && passed), showSignLink: isResult && passed,\n      primary, primaryLabel, primaryDisabled, left,\n      ringOffset: (201.1 * (1 - Math.min(1, frac))).toFixed(1),\n      ringTrack: active ? 'rgba(255,255,255,0.35)' : '#E3E8F2',\n      centerBg: active ? '#3D63DD' : '#FFFFFF', centerFg: active ? '#FFFFFF' : '#1D2433', centerShadow: active ? 0.38 : 0.12,\n      cCount: mode === 'count', cArrow: mode === 'arrow', cRetry: mode === 'retry', cWait: mode === 'wait',\n      q, qNo: s.qi + 1, attempt: s.attempt, opts,\n      hasFeedback: s.picked !== null, fbHead: right ? 'Richtig.' : 'Nicht ganz.',\n      fbBg: right ? '#E6F4EC' : '#FFF4DF', fbFg: right ? '#1E5A3C' : '#5A3A00',\n      passed, failed: isResult && !passed, resBg: passed ? '#E6F4EC' : '#FFF4DF',\n      resTitle: passed ? 'Bestanden!' : 'Fast geschafft',\n      resText: passed ? s.score + ' von ' + QUIZ.length + ' Fragen richtig. Klicke auf den gr\u00fcnen Button im Dock, um zu unterschreiben.' : s.score + ' von ' + QUIZ.length + ' richtig. Bestanden ist ab 80 %. Lies die Erkl\u00e4rungen und versuch es noch einmal.',\n      tocOpen: s.panel === 'toc', askOpen: s.panel === 'ask',\n      tocBtnBg: s.panel === 'toc' ? '#EAF0FE' : 'transparent', askBtnBg: s.panel === 'ask' ? '#EAF0FE' : 'transparent',\n      toggleToc: () => this.setState({ panel: s.panel === 'toc' ? null : 'toc' }),\n      toggleAsk: () => this.setState({ panel: s.panel === 'ask' ? null : 'ask', sent: false, question: '' }),\n      closePanel: () => this.setState({ panel: null }),\n      askRef: isRead ? 'Seite ' + (p + 1) : 'Frage ' + (s.qi + 1),\n      question: s.question, onQuestion: e => this.setState({ question: e.target.value }),\n      askForm: !s.sent, askSent: s.sent,\n      send: () => { if (s.question.trim()) this.setState({ sent: true }); },\n      sendDisabled: !s.question.trim(), sendBg: s.question.trim() ? '#3D63DD' : '#AFC0EE'\n    };\n  }\n}\n");
