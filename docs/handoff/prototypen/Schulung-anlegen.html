plate data-k=\"for\" list=\"{{pages}}\" as=\"p\" hint-placeholder-count=\"14\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px; align-items: center\">\n              <div style=\"width: 100%; aspect-ratio: 0.71; background: #FFFFFF; border: 1px solid {{p.border}}; border-radius: 4px; box-sizing: border-box; padding: 10% 12%; display: flex; flex-direction: column; gap: 5px\">\n                <div style=\"height: 6px; width: 70%; background: #CBD5E1; border-radius: 2px\"></div>\n                <div style=\"height: 3px; background: #E2E8F0; border-radius: 2px\"></div>\n                <div style=\"height: 3px; background: #E2E8F0; border-radius: 2px\"></div>\n                <div style=\"height: 3px; width: 80%; background: #E2E8F0; border-radius: 2px\"></div>\n                <div style=\"flex: 1; background: {{p.fill}}; border-radius: 2px\"></div>\n              </div>\n              <div style=\"font-size: 11px; color: #334155; text-align: center\">S. {{p.n}} \u00b7 <strong>{{p.t}}</strong></div>\n            </div>\n          </template>\n        </div>\n      </div>\n      <fieldset style=\"border: 1px solid #E3E6EB; border-radius: 10px; padding: 12px 16px; margin: 0\">\n        <legend style=\"font-size: 13px; font-weight: 600; padding: 0 6px\">Art der \u00c4nderung gegen\u00fcber v2</legend>\n        <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 6px 0\"><input type=\"radio\" name=\"chg\" checked style=\"margin-top: 3px\"><span><strong>Inhaltlich</strong> \u2013 alle mit g\u00fcltigem Nachweis v2 werden neu eingeladen (nur ge\u00e4nderte Seiten 3, 7, 8 lesen)</span></label>\n        <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 6px 0\"><input type=\"radio\" name=\"chg\" style=\"margin-top: 3px\"><span><strong>Redaktionell</strong> \u2013 bestehende Nachweise bleiben g\u00fcltig</span></label>\n      </fieldset>\n    </section>\n\n    <section a e: 12px; color: #5B6474\">N\u00e4chste Seite erst nach Erf\u00fcllung der aktuellen</span></span></label>\n        <label style=\"display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EEF0F3; font-size: 14px\"><input type=\"checkbox\" checked style=\"margin-top: 3px; width: 16px; height: 16px\"><span><strong>Abschluss-Quiz</strong><br><span style=\"font-size: 12px; color: #5B6474\">10 aus 25 Fragen \u00b7 Bestehen ab 80 % \u00b7 max. 3 Versuche</span></span></label>\n        <label style=\"display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EEF0F3; font-size: 14px\"><input type=\"checkbox\" checked style=\"margin-top: 3px; width: 16px; height: 16px\"><span><strong>Unterschrift mit Re-Authentifizierung</strong><br><span style=\"font-size: 12px; color: #5B6474\">Passwort/SSO, bei Externen OTP per SMS</span></span></label>\n        <label style=\"display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EEF0F3; font-size: 14px\"><input type=\"checkbox\" style=\"margin-top: 3px; width: 16px; height: 16px\"><span><strong>PDF-Download nach Abschluss</strong><br><span style=\"font-size: 12px; color: #5B6474\">Mit Wasserzeichen Name + Datum</span></span></label>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n        <label style=\"font-size: 12px; color: #5B6474\">Bearbeitungsfrist<select style=\"display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 14px; color: #0F172A; padding: 9px 10px; border: 1px solid #D0D5DD; border-radius: 8px\"><option>14 Tage</option></select></label>\n        <label style=\"font-size: 12px; color: #5B6474\">G\u00fcltigkeit / Wiederholung<select style=\"display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 14px; color: #0F172A; padding: 9px 10px; border: 1px solid #D0D5DD; border-radius: 8px\"><option>12 Monate</option></select></label>\n      </div>\n      <div style=\"font-size: 12px; color: #5B6474\">Erinnerungen: 7 und 2 Tage vor Frist, 1 Tag danach \u00b7 danach Eskalation an Vorgesetzten</div>\n      <label style=\"font-size: 12px; color: #5B6474\">Best\u00e4tigungstext<textarea rows=\"4\" style=\"display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; font-size: 13px; line-height: 1.45; color: #0F172A; padding: 10px; border: 1px solid #D0D5DD; border-radius: 8px; resize: vertical\">Ich habe die Unterweisung \u201eSicherheitsunterweisung 2026, Version 3\u201c vollst\u00e4ndig gelesen und verstanden. R\u00fcckfragen konnte ich an Dennis Hofmann richten.</textarea></label>\n      <div style=\"display: flex; justify-content: space-between; gap: 12px; padding-top: 4px\">\n        <a href=\"Main.dc.html\" style=\"font-size: 14px; font-weight: 600; padding: 11px 16px; border-radius: 8px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #0F172A; text-decoration: none\">Zur\u00fcck</a>\n        <a href=\"#\" style=\"font-size: 14px; font-weight: 600; padding: 11px 16px; border-radius: 8px; background: #1F4FD8; color: #FFFFFF; text-decoration: none\">Weiter: Zielgruppe</a>\n      </div>\n    </section>\n  </div>\n</div>\n", "\nclass Component extends DCLogic {\n  renderVals() {\n    const t = [18, 31, 42, 27, 4, 36, 45, 39, 22, 4, 33, 28, 41, 12];\n    const pages = t.map((s, i) => ({\n      n: i + 1,\n      t: s + ' s',\n      border: s === 4 ? '#C77A0A' : '#D0D5DD',\n      fill: s === 4 ? '#FDF3E2' : '#F1F5F9'\n    }));\n    return { pages };\n  }\n}\n");
