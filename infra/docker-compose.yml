# Schulungsnachweis – Betrieb mit Docker Compose (E-23)
# Start:  cp .env.example .env  (Werte setzen)  →  docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: schulungsnachweis

x-app-env: &app-env
  NODE_ENV: production
  API_HOST: 0.0.0.0
  LOGIN_LOCK_FREE_ATTEMPTS: ${LOGIN_LOCK_FREE_ATTEMPTS:-}
  LOGIN_LOCK_BASE_SECONDS: ${LOGIN_LOCK_BASE_SECONDS:-60}
  LOGIN_LOCK_MAX_SECONDS: ${LOGIN_LOCK_MAX_SECONDS:-86400}
  DATABASE_URL: postgres://app_user:${DB_APP_PASSWORD}@postgres:5432/${DB_NAME:-schulungsnachweis}
  REDIS_URL: redis://redis:6379
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  SESSION_SECRET: ${SESSION_SECRET}
  HMAC_MASTER_SECRET: ${HMAC_MASTER_SECRET}
  MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
  MAIL_FROM: ${MAIL_FROM}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  # Dateiablage: fs = Volume auf dem Server (Standard, z. B. Homeserver); s3 = externer S3-Speicher mit Object Lock (z. B. IONOS)
  STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
  STORAGE_DIR: /data/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-sn-uploads}
  S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:-sn-evidence}
  GOTENBERG_URL: http://gotenberg:3000
  PDF_RENDERER: gotenberg
  # Siegel/Zeitstempel optional (E-45): Standard „none“. Zum Einschalten SEAL_MODE=pyhanko und Zertifikat einbinden (docs/BETRIEB.md)
  SEAL_MODE: ${SEAL_MODE:-none}
  SEAL_P12_PATH: ${SEAL_P12_PATH:-}
  SEAL_P12_PASSWORD: ${SEAL_P12_PASSWORD:-}
  TSA_URL: ${TSA_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  # Einmalig bei jedem Start: Rollen/Datenbank anlegen und Migrationen ausführen
  migrate:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile, target: migrate }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      DB_NAME: ${DB_NAME:-schulungsnachweis}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD setzen}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD setzen}
      DATABASE_MIGRATOR_URL: postgres://app_migrator:${DB_MIGRATOR_PASSWORD}@postgres:5432/${DB_NAME:-schulungsnachweis}

  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile, target: api }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      API_PORT: 3000
    volumes: [storage:/data/storage]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # Nur Entwicklung/Test: fängt alle Mails ab (Web-Oberfläche :8025)
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev]
    ports: ['8025:8025']

  caddy:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    ports: ['80:80', '443:443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes: [caddydata:/data, caddyconfig:/config]

volumes:
  pgdata:
  redisdata:
  storage:
  caddydata:
  caddyconfig:
